<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>🪪 ลงทะเบียนบัตรสมาชิก | Horizontal Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom",
      "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
      "canvas-confetti": "https://esm.sh/canvas-confetti@1.9.3"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --espresso: #4A2530; --rosewood: #B56576; --sakura: #FFCAD4;
      --sakura-deep: #F4978E; --radius-lg: 26px; --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    @keyframes auroraBg { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    @keyframes holoShimmer { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    body {
      font-family: 'Kanit', 'Outfit', sans-serif; color: var(--espresso);
      background: linear-gradient(-45deg, #FFD6E0, #FFE8C8, #DCF5DC, #E5D4FF, #FFC8DD);
      background-size: 350% 350%; animation: auroraBg 15s ease infinite;
      min-height: 100dvh; padding: clamp(14px,3vw,26px) clamp(12px,3vw,20px) 70px; overflow-x: hidden;
    }
    .page-shell { max-width: 1180px; margin: 0 auto; position: relative; z-index: 2; }
    .boot-loader { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-weight: 700; color: #7A4957; font-size: 1.05rem; }

    .glass-panel {
      background: linear-gradient(145deg, rgba(255,249,251,0.92), rgba(255,240,246,0.86));
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 2px solid rgba(244,151,142,0.45); border-radius: var(--radius-lg);
      box-shadow: 0 18px 42px rgba(181,101,118,0.15);
    }
    .top-nav {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 22px; margin-bottom: 24px;
      background: linear-gradient(135deg, rgba(255,228,238,0.95), rgba(238,225,255,0.92), rgba(255,240,218,0.95));
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-orb { width: 46px; height: 46px; border-radius: 15px; background: linear-gradient(135deg, #FF758F, #B56576); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 18px rgba(181,101,118,0.35); }
    .brand h1 { font-size: clamp(1.05rem, 2.2vw, 1.25rem); font-weight: 700; color: #4A2530; }
    .brand p { font-size: 0.8rem; color: #8C5361; }

    .portal-grid { display: grid; grid-template-columns: minmax(330px, 0.96fr) minmax(350px, 1.34fr); gap: 24px; align-items: start; }
    .sticky-col { position: sticky; top: 20px; }

    /* บัตรสมาชิก Holographic 3D */
    .id-card {
      padding: 22px 20px; text-align: center; position: relative; overflow: hidden;
      background: linear-gradient(155deg, #FFF5F8 0%, #FFF0E6 48%, #F2E8FF 100%);
      border: 2.5px solid rgba(244,151,142,0.6); border-radius: var(--radius-lg);
      box-shadow: 0 24px 48px -12px rgba(181,101,118,0.26); transform-style: preserve-3d; will-change: transform;
    }
    .holo-foil-layer {
      position: absolute; inset: 0; pointer-events: none; z-index: 3;
      background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,0.75) 0%, rgba(255,182,193,0.28) 28%, rgba(195,166,255,0.22) 52%, transparent 75%);
      mix-blend-mode: soft-light; opacity: var(--gop, 0); transition: opacity 0.25s ease;
    }
    .holo-rainbow-border {
      position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0.32;
      background: linear-gradient(125deg, transparent 20%, rgba(255,255,255,0.8) 35%, rgba(255,183,178,0.5) 45%, rgba(226,209,249,0.6) 55%, transparent 70%);
      background-size: 250% 250%; animation: holoShimmer 6s ease infinite;
    }
    .id-card-aura { position: absolute; top: -22%; left: 50%; transform: translateX(-50%); width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, var(--role-color, #FF8DA1) 0%, transparent 70%); opacity: 0.45; filter: blur(26px); pointer-events: none; }
    .badge-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; position: relative; z-index: 4; }
    .pill { font-size: 0.73rem; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: #FFE5B4; color: #6E4720; border: 1px solid #F5C77E; display: inline-flex; align-items: center; gap: 5px; }
    .pill.ready { background: linear-gradient(135deg, #D4F5C7, #B8E8A3); color: #1B5E20; border-color: #8FD19E; }
    .pill.locked { background: linear-gradient(135deg, #5A2E38, #8C5361); color: #FFFDF9; border: none; }

    .avatar-wrap { width: 106px; height: 106px; margin: 4px auto 8px; position: relative; z-index: 4; }
    .avatar-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #FFCAD4; box-shadow: 0 12px 26px rgba(181,101,118,0.3); background: #fff; }
    .server-name { font-size: 1.22rem; font-weight: 700; color: #4A2530; position: relative; z-index: 4; }
    .discord-tag { font-size: 0.8rem; color: #8C5361; margin-bottom: 6px; position: relative; z-index: 4; }

    /* ป้ายพรีวิว "คุณ{ชื่อเล่น}" เด้งอัตโนมัติ */
    .you-live-pill {
      display: inline-block; margin: 2px auto 10px; padding: 4px 18px; border-radius: 999px;
      background: linear-gradient(135deg, #FBEED2, #FCCEAB); border: 2px solid #B56576;
      font-size: 1.05rem; font-weight: 800; color: #4A2530; position: relative; z-index: 4;
      box-shadow: 0 6px 14px rgba(181,101,118,0.18);
    }

    .card-action-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 12px; position: relative; z-index: 4; }
    .not-me-btn {
      display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px;
      font-family: inherit; font-size: 0.75rem; font-weight: 600; cursor: pointer;
      background: linear-gradient(135deg, #FFD1DC, #FFE5EC); color: #5A2E38; border: 1.5px solid #F4978E;
    }
    .inviter-tag-btn {
      display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 999px;
      font-family: inherit; font-size: 0.75rem; font-weight: 600; cursor: pointer;
      background: linear-gradient(135deg, #F3EAFF, #E2D1F9); color: #4A254B; border: 1.5px solid #C3A6FF;
    }

    .live-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; position: relative; z-index: 4; }
    .live-box { border-radius: 14px; padding: 8px 10px; border: 1.5px solid rgba(244,151,142,0.38); }
    .live-box.nick-theme { background: linear-gradient(135deg, #FFF0F5, #FFE4EC); }
    .live-box.bday-theme { background: linear-gradient(135deg, #F3EAFF, #E8DAFF); border-color: rgba(180,140,240,0.42); }
    .live-label { font-size: 0.71rem; font-weight: 600; color: #7A4957; }
    .live-val { font-size: 0.92rem; font-weight: 700; color: #4A2530; word-break: break-word; }

    .starter-coin-strip {
      position: relative; z-index: 4; margin-bottom: 12px; padding: 7px 12px; border-radius: 12px;
      background: linear-gradient(135deg, #FEF3E2, #FFE5B4); border: 1.5px solid #F5B041;
      font-size: 0.78rem; font-weight: 700; color: #6E4200; display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    /* กรอบแสดงชื่อเมนูเต็มทุกตัวอักษร */
    .showcase-box { background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(255,243,232,0.92)); border: 2px dashed #F4978E; border-radius: 18px; padding: 11px; text-align: left; position: relative; z-index: 4; }
    .showcase-title { font-size: 0.76rem; font-weight: 700; color: #8C5361; margin-bottom: 7px; text-align: center; }
    .showcase-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 7px 10px; border-radius: 12px; margin-bottom: 5px; font-size: 0.8rem; background: linear-gradient(90deg, #FFF9FB, #FFFDF9); border: 1px solid rgba(244,151,142,0.3); }
    .showcase-row:last-child { margin-bottom: 0; }
    .s-label { font-weight: 700; color: #7A4957; white-space: nowrap; flex-shrink: 0; }
    .s-name { font-weight: 700; color: var(--espresso); text-align: right; white-space: normal; word-break: break-word; line-height: 1.38; flex: 1; }

    .not-me-drawer { margin-top: 14px; padding: 16px; overflow: hidden; }
    .search-box { width: 100%; padding: 9px 14px; border-radius: 999px; border: 1.5px solid #F4978E; background: #FFFDF9; font-family: inherit; font-size: 0.85rem; outline: none; margin: 8px 0; }
    .member-scroll { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .member-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: 12px; background: #FFF9FB; border: 1px solid rgba(244,151,142,0.3); cursor: pointer; }
    .member-item.selected { background: #FFD1DC; border-color: #B56576; }
    .m-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .m-left img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .m-name { font-size: 0.84rem; font-weight: 600; }

    /* ฟอร์มฝั่งขวา */
    .form-panel { padding: clamp(20px,3vw,28px); }
    .sec-title { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; font-size: 0.96rem; font-weight: 700; color: #5A2E38; margin-bottom: 9px; }
    .sec-hint { font-size: 0.76rem; font-weight: 500; color: #8C5361; }
    .field-block { margin-bottom: 22px; }
    .text-input { width: 100%; padding: 12px 16px; border-radius: 14px; border: 1.5px solid #F4978E; background: #FFFDF9; font-family: inherit; font-size: 0.96rem; color: var(--espresso); outline: none; transition: all 0.2s ease; }
    .text-input:focus { background: #fff; border-color: #B56576; box-shadow: 0 0 0 4px rgba(244,151,142,0.22); }

    /* ปฏิทินวันเกิด */
    .real-calendar { background: linear-gradient(180deg, #FFFDF9 0%, #FFF5F8 100%); border-radius: 20px; border: 2px solid rgba(244,151,142,0.45); box-shadow: 0 10px 26px rgba(181,101,118,0.1); overflow: hidden; }
    .cal-top-bar { background: linear-gradient(135deg, #FF8DA1, #B56576, #9B72AA); color: #fff; padding: 11px 16px; display: flex; align-items: center; justify-content: space-between; }
    .cal-nav-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.2); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .cal-month-select { background: rgba(255,255,255,0.22); color: #fff; border: 1px solid rgba(255,255,255,0.45); padding: 5px 14px; border-radius: 10px; font-family: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer; outline: none; }
    .cal-month-select option { color: var(--espresso); background: #FFFDF9; }
    .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; background: #FFE8EE; padding: 8px 10px; font-size: 0.76rem; font-weight: 700; color: #7A4957; border-bottom: 1px solid rgba(244,151,142,0.3); }
    .cal-weekdays span:first-child { color: #D9534F; }
    .cal-weekdays span:last-child { color: #6C5CE7; }
    .cal-days-body { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 12px; }
    .cal-cell { aspect-ratio: 1; max-height: 40px; border-radius: 12px; border: 1px solid rgba(244,151,142,0.22); background: #FFF9FB; color: var(--espresso); font-family: inherit; font-weight: 600; font-size: 0.88rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .cal-cell.empty { background: transparent; border: none; pointer-events: none; }
    .cal-cell.selected { background: linear-gradient(135deg, #FF758F, #FF9EBB); color: #fff; border-color: #D6456B; font-weight: 700; box-shadow: 0 6px 14px rgba(214,69,107,0.35); }

    /* ช่องวางเมนู 3 ช่อง + ปุ่มสุ่ม */
    .random-drink-btn {
      padding: 5px 12px; border-radius: 999px; border: 1.5px solid #B56576;
      background: linear-gradient(135deg, #FFF0F5, #FBEED2); color: #5A2E38;
      font-family: inherit; font-size: 0.76rem; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .drop-slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .drop-slot { padding: 11px 12px; border-radius: 16px; background: linear-gradient(145deg, #FFFDF9, #FFF0F5); border: 2px dashed #F4978E; min-height: 94px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
    .drop-slot.slot-liked1 { background: linear-gradient(145deg, #FFFDF9, #F2F9EE); border-color: #98C989; }
    .drop-slot.slot-liked2 { background: linear-gradient(145deg, #FFFDF9, #F5EEFF); border-color: #BFA2EC; }
    .drop-slot.active-target { border-style: solid; border-width: 2.5px; box-shadow: 0 6px 16px rgba(181,101,118,0.16); }
    .drop-slot.drag-over { border-style: solid; border-color: #FF5D8F; background: #FFE0E9; transform: scale(1.04); }
    .slot-head { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; font-weight: 700; color: #5A2E38; padding-bottom: 5px; border-bottom: 1px dashed rgba(181,101,118,0.22); }
    .slot-clear { background: none; border: none; font-size: 0.72rem; color: #C0392B; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
    .slot-body { font-size: 0.82rem; font-weight: 700; color: var(--espresso); margin-top: 6px; white-space: normal; word-break: break-word; line-height: 1.35; }
    .slot-placeholder { font-size: 0.75rem; font-weight: 400; color: #9E7B86; }

    /* กล่องกระซิบความลับบาริสต้า */
    .whisper-secret-box {
      background: linear-gradient(135deg, #FFFDF7 0%, #FBEED2 50%, #FFD6E0 100%);
      border: 2px dashed #B56576; border-radius: 16px; padding: 10px 14px; margin-bottom: 12px;
      font-size: 0.8rem; line-height: 1.45; color: #4A2530;
    }

    /* สมุดเมนู: แถบรวมค้นหา + ที่คั่น + ปุ่มฟิลเตอร์ขนาดเล็ก */
    .catalog-box { background: linear-gradient(160deg, #FFF9FB 0%, #FFF3E8 50%, #F4EEFF 100%); border: 2px solid rgba(244,151,142,0.45); border-radius: 18px; padding: 12px; }
    .catalog-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: rgba(255,255,255,0.88); padding: 7px 11px; border-radius: 14px; border: 1.5px solid rgba(244,151,142,0.35); }
    .search-wrap { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 150px; }
    .toolbar-search { width: 100%; border: none; background: transparent; font-family: inherit; font-size: 0.82rem; color: var(--espresso); outline: none; }
    .toolbar-divider { width: 1.5px; height: 20px; background: rgba(181,101,118,0.32); flex-shrink: 0; }
    .cat-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .cat-tab { padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(244,151,142,0.4); background: #FFF0F5; color: #5A2E38; font-family: inherit; font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all 0.16s ease; }
    .cat-tab.active { background: linear-gradient(135deg, #B56576, #7A4957); color: #fff; border-color: transparent; }

    .catalog-section-divider { display: flex; align-items: center; gap: 10px; margin: 10px 0 8px; font-size: 0.72rem; font-weight: 700; color: #8C5361; }
    .catalog-section-divider::before, .catalog-section-divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(181,101,118,0.4), transparent); }

    .menu-grid { max-height: 230px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 7px; padding-right: 4px; }
    .menu-chip { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 11px; border-radius: 12px; border: 1px solid rgba(244,151,142,0.35); background: rgba(255,255,255,0.92); font-family: inherit; font-size: 0.79rem; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
    .menu-chip:active { cursor: grabbing; }
    .m-chip-name { font-weight: 600; color: var(--espresso); line-height: 1.3; word-break: break-word; flex: 1; }
    .chip-v-sep { width: 1px; align-self: stretch; background: rgba(181,101,118,0.22); margin: 0 2px; flex-shrink: 0; }

    .drag-ghost { position: fixed; z-index: 9999; pointer-events: none; padding: 9px 15px; border-radius: 999px; background: linear-gradient(135deg, #FF758F, #B56576); color: #fff; font-family: inherit; font-size: 0.84rem; font-weight: 700; box-shadow: 0 16px 32px rgba(90,46,56,0.4); transform: translate(-50%, -120%) scale(1.06); display: flex; align-items: center; gap: 8px; white-space: nowrap; }

    .tier-pill { font-size: 0.65rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; flex-shrink: 0; }
    .tier-SSR { background: linear-gradient(135deg, #FFD700, #FF9AA2); color: #4A2530; }
    .tier-SR { background: linear-gradient(135deg, #E2D1F9, #C3A6FF); color: #3B1E6D; }
    .tier-R { background: linear-gradient(135deg, #C1E1C1, #8FD19E); color: #1B4D20; }
    .tier-C { background: #FFE5EC; color: #7A4957; }
    .tier-MYSTERY { background: linear-gradient(90deg, #FFB7B2, #FFDAC1, #B5EAD7, #C7CEEA); color: #4A354B; }

    /* รหัส PIN 4 หลัก แบบ 4 ช่องคู่ (ตั้งรหัส + ยืนยันรหัส) */
    .pin-dual-wrap {
      background: linear-gradient(145deg, #3A1C2E, #23101C); color: #FFF8EB;
      border: 2px solid #F5B041; border-radius: 20px; padding: 16px;
    }
    .pin-dual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: center; text-align: center; }
    .pin-row-label { font-size: 0.76rem; font-weight: 700; color: #FFE49E; margin-bottom: 6px; }
    .pin-boxes { display: flex; justify-content: center; gap: 8px; }
    .pin-box-digit {
      width: 46px; height: 52px; border-radius: 12px; border: 2px solid rgba(255,213,107,0.45);
      background: rgba(15,7,12,0.85); color: #FFD56B; font-family: inherit; font-size: 1.35rem;
      font-weight: 800; text-align: center; outline: none; transition: all 0.16s ease;
    }
    .pin-box-digit:focus { border-color: #FFD56B; box-shadow: 0 0 0 3px rgba(255,213,107,0.28); transform: translateY(-2px); }
    .pin-box-digit.valid { border-color: #68E3A9; color: #68E3A9; background: rgba(20,60,40,0.8); }
    .pin-box-digit.invalid { border-color: #FF7B89; color: #FF7B89; background: rgba(70,18,28,0.8); }
    .pin-use-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .pin-use-card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,213,107,0.28); border-radius: 12px; padding: 8px 10px; font-size: 0.73rem; color: #F3ECE3; line-height: 1.35; }

    /* รางเลื่อนการ์ดทำเนียบเพื่อนสมาชิก */
    .friends-rail { display: flex; gap: 10px; overflow-x: auto; padding: 6px 2px 12px; scroll-snap-type: x mandatory; }
    .friends-rail::-webkit-scrollbar { height: 6px; }
    .friends-rail::-webkit-scrollbar-thumb { background: #F4978E; border-radius: 99px; }
    .friend-mini-card {
      flex: 0 0 190px; scroll-snap-align: start; background: #FFFDF9; border: 1.5px solid rgba(244,151,142,0.45);
      border-radius: 16px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .friend-mini-card.is-you { background: linear-gradient(155deg, #FFF5F8, #FBEED2); border: 2px solid #B56576; }
    .friend-mini-card img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #F4978E; }

    .submit-btn {
      width: 100%; min-height: 54px; border: none; border-radius: 16px;
      background: linear-gradient(135deg, #FF758F 0%, #B56576 50%, #6D597A 100%); color: #fff;
      font-family: inherit; font-size: 1.04rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 12px 28px -6px rgba(181,101,118,0.45); display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .submit-btn.success-mode { background: linear-gradient(135deg, #2E7D32, #66BB6A) !important; }
    .submit-btn:disabled { opacity: 0.65; cursor: not-allowed; }
    .toast { margin-top: 14px; padding: 12px 16px; border-radius: 14px; font-size: 0.9rem; font-weight: 600; }
    .toast.ok { background: rgba(46,125,50,0.16); color: #1B5E20; border: 1.5px solid rgba(46,125,50,0.4); }
    .toast.err { background: rgba(198,40,40,0.14); color: #B71C1C; border: 1.5px solid rgba(198,40,40,0.35); }

    /* ป๊อปอัปล็อกถามคนชวน ("ใครเป็นคนชวนคุณมาคะ ?" + "แน่ใจใช่ไหมคะ?") */
    .inviter-modal-backdrop {
      position: fixed; inset: 0; z-index: 950; background: rgba(42,25,32,0.78);
      backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .inviter-modal-card {
      width: 100%; max-width: 480px; background: linear-gradient(160deg, #FFFDF9 0%, #FBEED2 55%, #FFE4EC 100%);
      border: 2.5px solid #B56576; border-radius: 26px; padding: 24px 22px; text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4); display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .inviter-list-box {
      width: 100%; max-height: 220px; overflow-y: auto; background: #fff; border: 1.5px solid #F4978E;
      border-radius: 16px; padding: 6px; display: flex; flex-direction: column; gap: 5px; text-align: left;
    }
    .inviter-row {
      display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 12px;
      cursor: pointer; border: 1px solid transparent; transition: all 0.15s ease;
    }
    .inviter-row:hover { background: #FFF0F5; }
    .inviter-row.active { background: #FFD1DC; border-color: #B56576; }
    .inviter-row img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1.5px solid #B56576; }
    .modal-primary-btn {
      width: 100%; padding: 11px 22px; border-radius: 999px; border: none;
      background: linear-gradient(135deg, #B56576, #4A2530); color: #fff;
      font-family: inherit; font-size: 0.94rem; font-weight: 700; cursor: pointer;
    }
    .modal-primary-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .modal-sec-btn {
      padding: 10px 18px; border-radius: 999px; border: 1.5px solid #B56576;
      background: #fff; color: #4A2530; font-family: inherit; font-size: 0.86rem; font-weight: 700; cursor: pointer;
    }

    @media (max-width: 920px) { .portal-grid { grid-template-columns: 1fr; } .sticky-col { position: static; } }
    @media (max-width: 640px) {
      .drop-slots-grid, .pin-dual-grid, .pin-use-cards { grid-template-columns: 1fr; }
      .toolbar-divider { display: none; }
      .text-input, .search-box, .toolbar-search { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot-loader">🌸 กำลังเปิดสมุดลงทะเบียนบาริสต้า Alestia...</div>
  </div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { motion, AnimatePresence } from 'framer-motion';
    import {
      Sparkles, Coffee, CalendarHeart, ShieldCheck, Search,
      RefreshCw, Trash2, Dices, HeartHandshake, ChevronLeft, ChevronRight, Users
    } from 'lucide-react';
    import confetti from 'canvas-confetti';

    const MONTHS = [
      { num: 1, name: 'มกราคม', days: 31, offset: 4 },
      { num: 2, name: 'กุมภาพันธ์', days: 29, offset: 0 },
      { num: 3, name: 'มีนาคม', days: 31, offset: 1 },
      { num: 4, name: 'เมษายน', days: 30, offset: 4 },
      { num: 5, name: 'พฤษภาคม', days: 31, offset: 6 },
      { num: 6, name: 'มิถุนายน', days: 30, offset: 2 },
      { num: 7, name: 'กรกฎาคม', days: 31, offset: 4 },
      { num: 8, name: 'สิงหาคม', days: 31, offset: 0 },
      { num: 9, name: 'กันยายน', days: 30, offset: 3 },
      { num: 10, name: 'ตุลาคม', days: 31, offset: 5 },
      { num: 11, name: 'พฤศจิกายน', days: 30, offset: 1 },
      { num: 12, name: 'ธันวาคม', days: 31, offset: 3 }
    ];
    const DRINK_CAT_IDS = new Set(['create_one', 'coffee', 'tea', 'other_drink']);

    function fireSakuraConfetti(originX = 0.5, originY = 0.6, count = 75) {
      confetti({
        particleCount: count,
        spread: 85,
        origin: { x: originX, y: originY },
        colors: ['#FFD1DC', '#FF8DA1', '#E2D1F9', '#C1E1C1', '#FFE5B4', '#FFD700']
      });
    }

    function RegisterPortalApp() {
      const [eligibleMembers, setEligibleMembers] = useState([]);
      const [inviterCandidates, setInviterCandidates] = useState([]);
      const [showcaseMembers, setShowcaseMembers] = useState([]);
      const [categories, setCategories] = useState([]);

      const [currentUser, setCurrentUser] = useState(null);
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [memberQuery, setMemberQuery] = useState('');

      // ป๊อปอัปล็อกถามคนชวน ("SELECT" -> "CONFIRM" -> "UNLOCKED")
      const [inviterModalStep, setInviterModalStep] = useState('SELECT');
      const [inviterSearch, setInviterSearch] = useState('');
      const [selectedInviterObj, setSelectedInviterObj] = useState(null);
      const [inviterText, setInviterText] = useState('');

      const [nickname, setNickname] = useState('');
      const [curMonth, setCurMonth] = useState(1);
      const [curDay, setCurDay] = useState(null);
      const [slots, setSlots] = useState({ favorite: '', liked1: '', liked2: '' });
      const [activeSlot, setActiveSlot] = useState('favorite');
      const [activeCatId, setActiveCatId] = useState('coffee');
      const [menuQuery, setMenuQuery] = useState('');

      // รหัส PIN 4 หลัก 2 รอบ (แยก 4 ช่อง)
      const [pin1, setPin1] = useState(['', '', '', '']);
      const [pin2, setPin2] = useState(['', '', '', '']);
      const pin1Refs = [useRef(null), useRef(null), useRef(null), useRef(null)];
      const pin2Refs = [useRef(null), useRef(null), useRef(null), useRef(null)];

      const [submitting, setSubmitting] = useState(false);
      const [successDone, setSuccessDone] = useState(false);
      const [toast, setToast] = useState(null);

      // Holographic 3D Tilt
      const cardRef = useRef(null);
      const [tiltStyle, setTiltStyle] = useState({
        transform: 'perspective(950px) rotateX(0deg) rotateY(0deg)',
        '--gx': '50%', '--gy': '50%', '--gop': 0
      });

      // Drag Ghost
      const [dragGhost, setDragGhost] = useState(null);
      const [hoverSlot, setHoverSlot] = useState(null);

      const menuMap = useMemo(() => {
        const m = new Map();
        categories.forEach(c => (c.items || []).forEach(it => m.set(it.name, it)));
        return m;
      }, [categories]);

      const cleanNick = useMemo(() => nickname.trim().replace(/^คุณ\s*/, ''), [nickname]);
      const pin1Str = pin1.join('');
      const pin2Str = pin2.join('');
      const isPinMatched = pin1Str.length === 4 && pin1Str === pin2Str;

      const selectMember = (u, mapRef = menuMap) => {
        if (!u) return;
        setCurrentUser(u);
        setNickname((u.nickname || '').replace(/^คุณ\s*/, ''));
        if (u.inviter) setInviterText(u.inviter);
        setCurDay(u.birthdayDay || null);
        setCurMonth(u.birthdayMonth || 1);
        setSlots({
          favorite: u.favoriteMenu && u.favoriteMenu !== 'ขอคิดดูก่อน' && (!mapRef.size || mapRef.has(u.favoriteMenu)) ? u.favoriteMenu : '',
          liked1: u.likedMenu1 && u.likedMenu1 !== 'ขอคิดดูก่อน' && (!mapRef.size || mapRef.has(u.likedMenu1)) ? u.likedMenu1 : '',
          liked2: u.likedMenu2 && u.likedMenu2 !== 'ขอคิดดูก่อน' && (!mapRef.size || mapRef.has(u.likedMenu2)) ? u.likedMenu2 : ''
        });
        setToast(null);
        try { localStorage.setItem('alestia_last_discord_id', u.discordId); } catch (e) {}
      };

      useEffect(() => {
        async function load() {
          const [catRes, memRes] = await Promise.all([
            fetch('/api/register/catalog').then(r => r.json()).catch(() => ({ ok: false })),
            fetch('/api/register/members').then(r => r.json()).catch(() => ({ ok: false }))
          ]);

          const localMap = new Map();
          if (catRes?.ok && Array.isArray(catRes.categories)) {
            const drinkCats = catRes.categories.filter(c => c.typeKey === 'drink' || DRINK_CAT_IDS.has(c.id));
            drinkCats.forEach(c => (c.items || []).forEach(it => localMap.set(it.name, it)));
            setCategories(drinkCats);
            if (drinkCats.length > 0) setActiveCatId(drinkCats[0].id);
          }

          const members = memRes?.ok && Array.isArray(memRes.members) ? memRes.members : [];
          const inviters = memRes?.ok && Array.isArray(memRes.inviterCandidates) ? memRes.inviterCandidates : members;
          const showcases = memRes?.ok && Array.isArray(memRes.showcaseMembers) ? memRes.showcaseMembers : inviters.slice(0, 20);

          setEligibleMembers(members);
          setInviterCandidates(inviters);
          setShowcaseMembers(showcases);

          const params = new URLSearchParams(window.location.search);
          const targetId = params.get('id') || params.get('uid') || localStorage.getItem('alestia_last_discord_id');
          if (targetId) {
            const uRes = await fetch(`/api/register/user/${encodeURIComponent(targetId)}`).then(r => r.json()).catch(() => null);
            if (uRes?.ok && uRes.user) { selectMember(uRes.user, localMap); return; }
          }
          if (members.length > 0) selectMember(members[0], localMap);
          else setDrawerOpen(true);
        }
        load();
      }, []);

      const handleCardMove = (e) => {
        if (!window.matchMedia('(hover: hover)').matches || !cardRef.current) return;
        const r = cardRef.current.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width;
        const py = (e.clientY - r.top) / r.height;
        const rx = (0.5 - py) * 10;
        const ry = (px - 0.5) * 10;
        setTiltStyle({
          transform: `perspective(950px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`,
          '--gx': `${(px * 100).toFixed(1)}%`,
          '--gy': `${(py * 100).toFixed(1)}%`,
          '--gop': 0.85
        });
      };

      const handleCardLeave = () => {
        setTiltStyle({
          transform: 'perspective(950px) rotateX(0deg) rotateY(0deg)',
          '--gx': '50%', '--gy': '50%', '--gop': 0
        });
      };

      const assignDrink = (slotKey, itemName, clientX, clientY) => {
        setSlots(prev => {
          const next = { ...prev, [slotKey]: itemName };
          if (slotKey === 'favorite' && !prev.liked1) setActiveSlot('liked1');
          else if (slotKey === 'liked1' && !prev.liked2) setActiveSlot('liked2');
          return next;
        });
        if (clientX && clientY) {
          fireSakuraConfetti(clientX / window.innerWidth, clientY / window.innerHeight, 18);
        }
      };

      const randomizeThreeDrinks = () => {
        const allDrinks = [];
        categories.forEach(c => (c.items || []).forEach(it => allDrinks.push(it.name)));
        if (allDrinks.length < 3) return;
        const shuffled = [...allDrinks].sort(() => Math.random() - 0.5);
        setSlots({ favorite: shuffled[0], liked1: shuffled[1], liked2: shuffled[2] });
        fireSakuraConfetti(0.5, 0.5, 35);
      };

      const startPointerDrag = (e, item) => {
        if (e.button && e.button !== 0) return;
        const startX = e.clientX, startY = e.clientY;
        let dragging = false;
        const timer = setTimeout(() => {
          dragging = true;
          setDragGhost({ item, x: startX, y: startY });
        }, e.pointerType === 'mouse' ? 80 : 180);

        const onMove = (ev) => {
          const moved = Math.abs(ev.clientX - startX) > 5 || Math.abs(ev.clientY - startY) > 5;
          if (!dragging && e.pointerType === 'mouse' && moved) {
            clearTimeout(timer);
            dragging = true;
          }
          if (!dragging) return;
          ev.preventDefault();
          setDragGhost({ item, x: ev.clientX, y: ev.clientY });
          const dropEl = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.drop-slot');
          setHoverSlot(dropEl?.dataset?.slot || null);
        };

        const onUp = (ev) => {
          clearTimeout(timer);
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointercancel', onUp);
          if (dragging) {
            const dropEl = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.drop-slot');
            if (dropEl?.dataset?.slot) assignDrink(dropEl.dataset.slot, item.name, ev.clientX, ev.clientY);
          } else {
            assignDrink(activeSlot, item.name, ev.clientX, ev.clientY);
          }
          setDragGhost(null);
          setHoverSlot(null);
        };

        window.addEventListener('pointermove', onMove, { passive: false });
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
      };

      // จัดการช่องกรอก PIN 4 หลัก 2 รอบ
      const handlePinDigitChange = (round, idx, val) => {
        const digit = val.replace(/\D/g, '').slice(-1);
        if (round === 1) {
          const next = [...pin1];
          next[idx] = digit;
          setPin1(next);
          if (digit) {
            if (idx < 3) pin1Refs[idx + 1].current?.focus();
            else pin2Refs[0].current?.focus();
          }
        } else {
          const next = [...pin2];
          next[idx] = digit;
          setPin2(next);
          if (digit && idx < 3) pin2Refs[idx + 1].current?.focus();
        }
      };

      const handlePinKeyDown = (e, round, idx) => {
        if (e.key !== 'Backspace') return;
        const arr = round === 1 ? pin1 : pin2;
        const setArr = round === 1 ? setPin1 : setPin2;
        const refs = round === 1 ? pin1Refs : pin2Refs;
        if (!arr[idx] && idx > 0) {
          const next = [...arr];
          next[idx - 1] = '';
          setArr(next);
          refs[idx - 1].current?.focus();
          e.preventDefault();
        }
      };

      const monthObj = MONTHS.find(m => m.num === Number(curMonth)) || MONTHS[0];
      const safeDay = curDay && curDay > monthObj.days ? monthObj.days : curDay;

      const displayedDrinks = useMemo(() => {
        const q = menuQuery.trim().toLowerCase();
        if (q) {
          const all = [];
          categories.forEach(c => (c.items || []).forEach(it => {
            if (it.name.toLowerCase().includes(q) || (it.tierCode && it.tierCode.toLowerCase().includes(q))) all.push(it);
          }));
          return all;
        }
        return categories.find(c => c.id === activeCatId)?.items || [];
      }, [categories, activeCatId, menuQuery]);

      const filteredMembers = useMemo(() => {
        const q = memberQuery.trim().toLowerCase();
        return eligibleMembers.filter(m => !q || m.displayName.toLowerCase().includes(q) || m.username.toLowerCase().includes(q)).slice(0, 50);
      }, [eligibleMembers, memberQuery]);

      const filteredInviters = useMemo(() => {
        const q = inviterSearch.trim().toLowerCase();
        return inviterCandidates.filter(m =>
          !q || m.displayName.toLowerCase().includes(q) || m.username.toLowerCase().includes(q) || (m.nickname && m.nickname.toLowerCase().includes(q))
        );
      }, [inviterCandidates, inviterSearch]);

      const confirmInviterChoice = () => {
        if (!selectedInviterObj) return;
        const label = selectedInviterObj.nickname ? `คุณ${selectedInviterObj.nickname}` : selectedInviterObj.displayName;
        setInviterText(label);
        setInviterModalStep('UNLOCKED');
        fireSakuraConfetti(0.5, 0.5, 55);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!inviterText) { setInviterModalStep('SELECT'); return; }
        if (!currentUser?.discordId) return setToast({ ok: false, text: 'กรุณาเลือกบัญชีของคุณก่อนค่ะ' });
        if (currentUser.hasMemberRole) return setToast({ ok: false, text: 'บัญชีนี้มียศสมาชิกอยู่แล้วค่ะ' });
        if (!cleanNick) return setToast({ ok: false, text: 'กรุณาตั้งชื่อเล่นประจำคาเฟ่ก่อนนะคะ 🏷️' });
        if (!safeDay) return setToast({ ok: false, text: 'กรุณาเลือกวันที่เกิดในปฏิทินก่อนนะคะ 🎂' });
        if (!isPinMatched) return setToast({ ok: false, text: 'กรุณาตั้งรหัสปลอดภัย PIN 4 หลักให้ตรงกันทั้ง 2 รอบค่ะ 🔐' });

        setSubmitting(true);
        setToast(null);
        try {
          const res = await fetch('/api/register/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              discordId: currentUser.discordId,
              inviter: inviterText,
              nickname: cleanNick,
              birthdayDay: safeDay,
              birthdayMonth: curMonth,
              favoriteMenu: slots.favorite || 'ขอคิดดูก่อน',
              likedMenu1: slots.liked1 || 'ขอคิดดูก่อน',
              likedMenu2: slots.liked2 || 'ขอคิดดูก่อน',
              pin: pin1Str,
              confirmPin: pin2Str
            })
          });
          const data = await res.json();
          if (!data.ok) {
            setToast({ ok: false, text: data.error || 'บันทึกไม่สำเร็จค่ะ' });
          } else {
            setSuccessDone(true);
            fireSakuraConfetti(0.5, 0.55, 110);
            setTimeout(() => fireSakuraConfetti(0.3, 0.4, 70), 220);
            setTimeout(() => fireSakuraConfetti(0.7, 0.4, 70), 420);
            setToast({ ok: true, text: data.message });
            if (data.user) setCurrentUser(data.user);
            setTimeout(() => { window.location.href = '/members'; }, 1800);
          }
        } catch (err) {
          setToast({ ok: false, text: 'การเชื่อมต่อขัดข้อง ลองใหม่อีกครั้งนะคะ' });
        } finally {
          setSubmitting(false);
        }
      };

      const renderDrinkBadge = (name, placeholder) => {
        if (!name) return <span className="slot-placeholder">{placeholder}</span>;
        const info = menuMap.get(name) || { icon: '🍹', tierCode: 'C' };
        const tClass = info.tierCode === '?' ? 'MYSTERY' : info.tierCode;
        return (
          <span>
            {info.icon} {name} <span className={`tier-pill tier-${tClass}`}>{info.tierCode}</span>
          </span>
        );
      };

      return (
        <div className="page-shell">
          {/* 🔒 ป๊อปอัปล็อกถามคนชวน 2 ขั้นตอน ("ใครเป็นคนชวนคุณมาคะ ?" + "แน่ใจใช่ไหมคะ?") */}
          <AnimatePresence>
            {inviterModalStep !== 'UNLOCKED' && (
              <motion.div
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                exit={{ opacity: 0 }}
                className="inviter-modal-backdrop"
              >
                <motion.div
                  initial={{ scale: 0.9, y: 16 }}
                  animate={{ scale: 1, y: 0 }}
                  exit={{ scale: 0.9, y: 16 }}
                  className="inviter-modal-card"
                >
                  {inviterModalStep === 'SELECT' ? (
                    <>
                      <div style={{ fontSize: '2.2rem', lineHeight: 1 }}>💌</div>
                      <h2 style={{ fontSize: '1.3rem', fontWeight: 800, color: '#4A2530' }}>ใครเป็นคนชวนคุณมาคะ ?</h2>
                      <p style={{ fontSize: '0.82rem', color: '#8C5361', marginTop: -4 }}>
                        ก่อนเริ่มสร้างบัตรสมาชิกโฮโลแกรม กรุณาเลือกรายชื่อเพื่อนที่ชวนคุณเข้ามาในคาเฟ่ก่อนนะคะ
                      </p>

                      <input
                        type="text"
                        className="search-box"
                        style={{ margin: '4px 0' }}
                        placeholder="🔍 พิมพ์ค้นหาชื่อเพื่อนที่ชวนคุณ..."
                        value={inviterSearch}
                        onChange={e => setInviterSearch(e.target.value)}
                      />

                      <div className="inviter-list-box">
                        {filteredInviters.map(m => {
                          const isSel = selectedInviterObj?.discordId === m.discordId;
                          return (
                            <div
                              key={m.discordId}
                              onClick={() => setSelectedInviterObj(m)}
                              className={`inviter-row ${isSel ? 'active' : ''}`}
                            >
                              <img src={m.avatarUrl} alt="" />
                              <div style={{ flex: 1, minWidth: 0 }}>
                                <div style={{ fontSize: '0.86rem', fontWeight: 700, color: '#4A2530' }}>{m.displayName}</div>
                                <div style={{ fontSize: '0.73rem', color: '#8C5361' }}>
                                  {m.nickname ? `"คุณ${m.nickname}"` : `@${m.username}`}
                                </div>
                              </div>
                              {isSel && <span className="pill ready">เลือกแล้ว</span>}
                            </div>
                          );
                        })}
                      </div>

                      <button
                        type="button"
                        disabled={!selectedInviterObj}
                        onClick={() => setInviterModalStep('CONFIRM')}
                        className="modal-primary-btn"
                      >
                        ตกลง ➔
                      </button>
                    </>
                  ) : (
                    <>
                      <div style={{ fontSize: '2rem', lineHeight: 1 }}>✨🤝✨</div>
                      <h2 style={{ fontSize: '1.32rem', fontWeight: 800, color: '#4A2530' }}>แน่ใจใช่ไหมคะ?</h2>
                      <p style={{ fontSize: '0.84rem', color: '#8C5361' }}>คุณกำลังจะระบุว่าผู้ที่ชวนคุณเข้ามาในคาเฟ่คือ</p>

                      {selectedInviterObj && (
                        <div style={{
                          display: 'flex', alignItems: 'center', gap: 12, background: '#fff',

          {dragGhost && (
            <div className="drag-ghost" style={{ left: dragGhost.x, top: dragGhost.y }}>
              <span>{dragGhost.item.icon || '🍹'}</span>
              <span>{dragGhost.item.name}</span>
            </div>
          )}
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<RegisterPortalApp />);
  </script>
</body>
</html>
