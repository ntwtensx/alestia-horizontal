<head>

  <!-- Import Map ดึง React, Framer Motion, Lucide Icons และ Confetti ผ่าน CDN -->
  <script type="importmap">

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --espresso: #4A2530; --rosewood: #B56576; --sakura: #FFCAD4;
      --sakura-deep: #F4978E; --radius-lg: 26px; --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    @keyframes auroraBg { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    @keyframes holoShimmer { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    body {
      font-family: 'Kanit', 'Outfit', sans-serif; color: var(--espresso);
      background: linear-gradient(-45deg, #FFD6E0, #FFE8C8, #DCF5DC, #E5D4FF, #FFC8DD);
      background-size: 350% 350%; animation: auroraBg 15s ease infinite;
      min-height: 100dvh; padding: clamp(14px,3vw,26px) clamp(12px,3vw,20px) 70px; overflow-x: hidden;
    }
    .page-shell { max-width: 1180px; margin: 0 auto; position: relative; z-index: 2; }
    .boot-loader {
      min-height: 70vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; font-weight: 700; color: #7A4957; font-size: 1.05rem;
    }

    .glass-panel {
      background: linear-gradient(145deg, rgba(255,249,251,0.92), rgba(255,240,246,0.86));
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 2px solid rgba(244,151,142,0.45); border-radius: var(--radius-lg);
      box-shadow: 0 18px 42px rgba(181,101,118,0.15);
    }
    .top-nav {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 22px; margin-bottom: 24px;
      background: linear-gradient(135deg, rgba(255,228,238,0.95), rgba(238,225,255,0.92), rgba(255,240,218,0.95));
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-orb {
      width: 46px; height: 46px; border-radius: 15px;
      background: linear-gradient(135deg, #FF758F, #B56576); color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 18px rgba(181,101,118,0.35);
    }
    .brand h1 { font-size: clamp(1.05rem, 2.2vw, 1.25rem); font-weight: 700; color: #4A2530; }
    .brand p { font-size: 0.8rem; color: #8C5361; }

    .portal-grid { display: grid; grid-template-columns: minmax(330px, 0.96fr) minmax(350px, 1.34fr); gap: 24px; align-items: start; }
    .sticky-col { position: sticky; top: 20px; }

    /* บัตรสมาชิก Holographic 3D */
    .id-card {
      padding: 24px 20px; text-align: center; position: relative; overflow: hidden;
      background: linear-gradient(155deg, #FFF5F8 0%, #FFF0E6 48%, #F2E8FF 100%);
      border: 2.5px solid rgba(244,151,142,0.6); border-radius: var(--radius-lg);
      box-shadow: 0 24px 48px -12px rgba(181,101,118,0.26);
      transform-style: preserve-3d; will-change: transform;
    }
    .holo-foil-layer {
      position: absolute; inset: 0; pointer-events: none; z-index: 3;
      background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,0.75) 0%, rgba(255,182,193,0.28) 28%, rgba(195,166,255,0.22) 52%, transparent 75%);
      mix-blend-mode: soft-light; opacity: var(--gop, 0); transition: opacity 0.25s ease;
    }
    .holo-rainbow-border {
      position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0.32;
      background: linear-gradient(125deg, transparent 20%, rgba(255,255,255,0.8) 35%, rgba(255,183,178,0.5) 45%, rgba(226,209,249,0.6) 55%, transparent 70%);
      background-size: 250% 250%; animation: holoShimmer 6s ease infinite;
    }
    .id-card-aura {

    .server-name { font-size: 1.28rem; font-weight: 700; color: #4A2530; position: relative; z-index: 4; }
    .discord-tag { font-size: 0.82rem; color: #8C5361; margin-bottom: 10px; position: relative; z-index: 4; }

    .not-me-btn {

      font-family: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer;

    .live-box.nick-theme { background: linear-gradient(135deg, #FFF0F5, #FFE4EC); }
    .live-box.bday-theme { background: linear-gradient(135deg, #F3EAFF, #E8DAFF); border-color: rgba(180,140,240,0.42); }

    /* กรอบแสดงชื่อเมนูเต็มทุกตัวอักษร */
    .showcase-box {

    .showcase-row:last-child { margin-bottom: 0; }

    .not-me-drawer { margin-top: 14px; padding: 16px; overflow: hidden; }
    .search-box { width: 100%; padding: 9px 14px; border-radius: 999px; border: 1.5px solid #F4978E; background: #FFFDF9; font-family: inherit; font-size: 0.86rem; outline: none; margin: 8px 0; }
    .member-scroll { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .member-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: 12px; background: #FFF9FB; border: 1px solid rgba(244,151,142,0.3); cursor: pointer; }
    .member-item.selected { background: #FFD1DC; border-color: #B56576; }
    .m-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .m-left img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .m-name { font-size: 0.84rem; font-weight: 600; }

    /* ฟอร์มฝั่งขวา */
    .form-panel { padding: clamp(20px,3vw,28px); }
    .sec-title { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; font-size: 0.96rem; font-weight: 700; color: #5A2E38; margin-bottom: 9px; }
    .sec-hint { font-size: 0.76rem; font-weight: 500; color: #8C5361; }
    .field-block { margin-bottom: 22px; }
    .text-input {
      width: 100%; padding: 12px 16px; border-radius: 14px; border: 1.5px solid #F4978E;

    }
    .text-input:focus { background: #fff; border-color: #B56576; box-shadow: 0 0 0 4px rgba(244,151,142,0.22); }

    /* ปฏิทินวันเกิด */
    .real-calendar {
      background: linear-gradient(180deg, #FFFDF9 0%, #FFF5F8 100%);
      border-radius: 20px; border: 2px solid rgba(244,151,142,0.45);
      box-shadow: 0 10px 26px rgba(181,101,118,0.1); overflow: hidden;
    }
    .cal-top-bar {
      background: linear-gradient(135deg, #FF8DA1, #B56576, #9B72AA); color: #fff;
      padding: 11px 16px; display: flex; align-items: center; justify-content: space-between;
    }
    .cal-nav-btn {
      width: 34px; height: 34px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.2); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .cal-month-select {
      background: rgba(255,255,255,0.22); color: #fff; border: 1px solid rgba(255,255,255,0.45);
      padding: 5px 14px; border-radius: 10px; font-family: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer; outline: none;
    }
    .cal-month-select option { color: var(--espresso); background: #FFFDF9; }
    .cal-weekdays {
      display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
      background: #FFE8EE; padding: 8px 10px; font-size: 0.76rem; font-weight: 700; color: #7A4957;
      border-bottom: 1px solid rgba(244,151,142,0.3);
    }
    .cal-weekdays span:first-child { color: #D9534F; }
    .cal-weekdays span:last-child { color: #6C5CE7; }
    .cal-days-body { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 12px; }
    .cal-cell {
      aspect-ratio: 1; max-height: 40px; border-radius: 12px; border: 1px solid rgba(244,151,142,0.22);
      background: #FFF9FB; color: var(--espresso); font-family: inherit; font-weight: 600; font-size: 0.88rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .cal-cell.empty { background: transparent; border: none; pointer-events: none; }
    .cal-cell.selected {
      background: linear-gradient(135deg, #FF758F, #FF9EBB); color: #fff;
      border-color: #D6456B; font-weight: 700; box-shadow: 0 6px 14px rgba(214,69,107,0.35);
    }

    /* ช่องวางเมนู 3 ช่อง */
    .drop-slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .drop-slot {
      padding: 11px 12px; border-radius: 16px; background: linear-gradient(145deg, #FFFDF9, #FFF0F5);
      border: 2px dashed #F4978E; min-height: 96px; display: flex; flex-direction: column;
      justify-content: space-between; cursor: pointer; transition: border-color 0.2s, background 0.2s;
    }
    .drop-slot.slot-liked1 { background: linear-gradient(145deg, #FFFDF9, #F2F9EE); border-color: #98C989; }
    .drop-slot.slot-liked2 { background: linear-gradient(145deg, #FFFDF9, #F5EEFF); border-color: #BFA2EC; }
    .drop-slot.active-target { border-style: solid; border-width: 2.5px; box-shadow: 0 6px 16px rgba(181,101,118,0.16); }
    .drop-slot.drag-over { border-style: solid; border-color: #FF5D8F; background: #FFE0E9; transform: scale(1.04); }
    .slot-head { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; font-weight: 700; color: #5A2E38; padding-bottom: 5px; border-bottom: 1px dashed rgba(181,101,118,0.22); }
    .slot-clear { background: none; border: none; font-size: 0.72rem; color: #C0392B; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
    .slot-body { font-size: 0.82rem; font-weight: 700; color: var(--espresso); margin-top: 6px; white-space: normal; word-break: break-word; line-height: 1.35; }
    .slot-placeholder { font-size: 0.75rem; font-weight: 400; color: #9E7B86; }

    /* สมุดเมนู: แถบรวมค้นหา + ที่คั่น + ปุ่มฟิลเตอร์ขนาดเล็ก */
    .catalog-box {
      background: linear-gradient(160deg, #FFF9FB 0%, #FFF3E8 50%, #F4EEFF 100%);
      border: 2px solid rgba(244,151,142,0.45); border-radius: 18px; padding: 12px;
    }
    .catalog-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.88); padding: 7px 11px; border-radius: 14px;
      border: 1.5px solid rgba(244,151,142,0.35);
    }
    .search-wrap { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 150px; }
    .toolbar-search { width: 100%; border: none; background: transparent; font-family: inherit; font-size: 0.82rem; color: var(--espresso); outline: none; }
    .toolbar-divider { width: 1.5px; height: 20px; background: rgba(181,101,118,0.32); flex-shrink: 0; }
    .cat-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .cat-tab {
      padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(244,151,142,0.4);
      background: #FFF0F5; color: #5A2E38; font-family: inherit; font-size: 0.72rem;
      font-weight: 600; cursor: pointer; transition: all 0.16s ease;
    }
    .cat-tab.active { background: linear-gradient(135deg, #B56576, #7A4957); color: #fff; border-color: transparent; }

    .catalog-section-divider {
      display: flex; align-items: center; gap: 10px; margin: 10px 0 8px;
      font-size: 0.72rem; font-weight: 700; color: #8C5361;
    }
    .catalog-section-divider::before, .catalog-section-divider::after {
      content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(181,101,118,0.4), transparent);
    }

    .menu-grid { max-height: 240px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 7px; padding-right: 4px; }
    .menu-chip {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 11px; border-radius: 12px; border: 1px solid rgba(244,151,142,0.35);
      background: rgba(255,255,255,0.92); font-family: inherit; font-size: 0.79rem; cursor: grab;
      user-select: none; -webkit-user-select: none; touch-action: pan-y;
    }
    .menu-chip:active { cursor: grabbing; }
    .m-chip-name { font-weight: 600; color: var(--espresso); line-height: 1.3; word-break: break-word; flex: 1; }
    .chip-v-sep { width: 1px; align-self: stretch; background: rgba(181,101,118,0.22); margin: 0 2px; flex-shrink: 0; }

    .drag-ghost {
      position: fixed; z-index: 9999; pointer-events: none;
      padding: 9px 15px; border-radius: 999px; background: linear-gradient(135deg, #FF758F, #B56576); color: #fff;
      font-family: inherit; font-size: 0.84rem; font-weight: 700;
      box-shadow: 0 16px 32px rgba(90,46,56,0.4); transform: translate(-50%, -120%) scale(1.06);
      display: flex; align-items: center; gap: 8px; white-space: nowrap;
    }

    .tier-pill { font-size: 0.65rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; flex-shrink: 0; }
    .tier-SSR { background: linear-gradient(135deg, #FFD700, #FF9AA2); color: #4A2530; }
    .tier-SR { background: linear-gradient(135deg, #E2D1F9, #C3A6FF); color: #3B1E6D; }
    .tier-R { background: linear-gradient(135deg, #C1E1C1, #8FD19E); color: #1B4D20; }
    .tier-C { background: #FFE5EC; color: #7A4957; }
    .tier-MYSTERY { background: linear-gradient(90deg, #FFB7B2, #FFDAC1, #B5EAD7, #C7CEEA); color: #4A354B; }

    .pin-wrap { display: flex; align-items: center; gap: 12px; }
    .pin-input-4 { letter-spacing: 0.55em; font-weight: 700; text-align: center; font-size: 1.25rem; max-width: 210px; }
    .pin-dots { display: flex; gap: 8px; }
    .pin-dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(181,101,118,0.28); transition: all 0.2s var(--spring); }
    .pin-dot.filled { background: #D6456B; transform: scale(1.25); box-shadow: 0 0 8px rgba(214,69,107,0.5); }

    .submit-btn {
      width: 100%; min-height: 52px; border: none; border-radius: 16px;
      background: linear-gradient(135deg, #FF758F 0%, #B56576 50%, #6D597A 100%); color: #fff;
      font-family: inherit; font-size: 1.02rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 12px 28px -6px rgba(181,101,118,0.45); display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    @media (max-width: 920px) { .portal-grid { grid-template-columns: 1fr; } .sticky-col { position: static; } }

</head>
<body>
  <div id="root">
    <div class="boot-loader">🌸 กำลังเปิดสมุดลงทะเบียนบาริสต้า Alestia...</div>
  </div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { motion, AnimatePresence } from 'framer-motion';
    import {
      Sparkles, Coffee, CalendarHeart, ShieldCheck, Search,
      RefreshCw, Trash2, Eye, EyeOff, ChevronLeft, ChevronRight
    } from 'lucide-react';
    import confetti from 'canvas-confetti';

    const MONTHS = [
      { num: 1, name: 'มกราคม', days: 31, offset: 4 },
      { num: 2, name: 'กุมภาพันธ์', days: 29, offset: 0 },
      { num: 3, name: 'มีนาคม', days: 31, offset: 1 },
      { num: 4, name: 'เมษายน', days: 30, offset: 4 },
      { num: 5, name: 'พฤษภาคม', days: 31, offset: 6 },
      { num: 6, name: 'มิถุนายน', days: 30, offset: 2 },
      { num: 7, name: 'กรกฎาคม', days: 31, offset: 4 },
      { num: 8, name: 'สิงหาคม', days: 31, offset: 0 },
      { num: 9, name: 'กันยายน', days: 30, offset: 3 },
      { num: 10, name: 'ตุลาคม', days: 31, offset: 5 },
      { num: 11, name: 'พฤศจิกายน', days: 30, offset: 1 },
      { num: 12, name: 'ธันวาคม', days: 31, offset: 3 }
    ];
    const DRINK_CAT_IDS = new Set(['create_one', 'coffee', 'tea', 'other_drink']);

    function fireSakuraConfetti(originX = 0.5, originY = 0.6, count = 70) {
      confetti({
        particleCount: count,
        spread: 80,
        origin: { x: originX, y: originY },
        colors: ['#FFD1DC', '#FF8DA1', '#E2D1F9', '#C1E1C1', '#FFE5B4', '#FFD700']
      });
    }

    function RegisterPortalApp() {
      const [eligibleMembers, setEligibleMembers] = useState([]);
      const [categories, setCategories] = useState([]);
      const [currentUser, setCurrentUser] = useState(null);
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [memberQuery, setMemberQuery] = useState('');

      const [nickname, setNickname] = useState('');
      const [curMonth, setCurMonth] = useState(1);
      const [curDay, setCurDay] = useState(null);
      const [slots, setSlots] = useState({ favorite: '', liked1: '', liked2: '' });
      const [activeSlot, setActiveSlot] = useState('favorite');
      const [activeCatId, setActiveCatId] = useState('coffee');
      const [menuQuery, setMenuQuery] = useState('');

      const [pin, setPin] = useState('');
      const [showPin, setShowPin] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const [toast, setToast] = useState(null);

      // Holographic 3D Tilt state
      const cardRef = useRef(null);
      const [tiltStyle, setTiltStyle] = useState({
        transform: 'perspective(950px) rotateX(0deg) rotateY(0deg)',
        '--gx': '50%', '--gy': '50%', '--gop': 0
      });

      // Drag Ghost state
      const [dragGhost, setDragGhost] = useState(null);
      const [hoverSlot, setHoverSlot] = useState(null);

      const menuMap = useMemo(() => {
        const m = new Map();
        categories.forEach(c => (c.items || []).forEach(it => m.set(it.name, it)));
        return m;
      }, [categories]);

      const selectMember = (u, mapRef = menuMap) => {
        if (!u) return;
        setCurrentUser(u);
        setNickname(u.nickname || '');
        setCurDay(u.birthdayDay || null);
        setCurMonth(u.birthdayMonth || 1);
        setSlots({
          favorite: u.favoriteMenu && u.favoriteMenu !== 'ขอคิดดูก่อน' && (!mapRef.size || mapRef.has(u.favoriteMenu)) ? u.favoriteMenu : '',
          liked1: u.likedMenu1 && u.likedMenu1 !== 'ขอคิดดูก่อน' && (!mapRef.size || mapRef.has(u.likedMenu1)) ? u.likedMenu1 : '',
          liked2: u.likedMenu2 && u.likedMenu2 !== 'ขอคิดดูก่อน' && (!mapRef.size || mapRef.has(u.likedMenu2)) ? u.likedMenu2 : ''
        });
        setToast(null);
        try { localStorage.setItem('alestia_last_discord_id', u.discordId); } catch (e) {}
      };

      useEffect(() => {
        async function load() {
          const [catRes, memRes] = await Promise.all([
            fetch('/api/register/catalog').then(r => r.json()).catch(() => ({ ok: false })),
            fetch('/api/register/members').then(r => r.json()).catch(() => ({ ok: false }))
          ]);

          const localMap = new Map();
          if (catRes?.ok && Array.isArray(catRes.categories)) {
            const drinkCats = catRes.categories.filter(c => c.typeKey === 'drink' || DRINK_CAT_IDS.has(c.id));
            drinkCats.forEach(c => (c.items || []).forEach(it => localMap.set(it.name, it)));
            setCategories(drinkCats);
            if (drinkCats.length > 0) setActiveCatId(drinkCats[0].id);
          }

          const members = memRes?.ok && Array.isArray(memRes.members) ? memRes.members : [];
          setEligibleMembers(members);

          const params = new URLSearchParams(window.location.search);
          const targetId = params.get('id') || localStorage.getItem('alestia_last_discord_id');
          if (targetId) {
            const uRes = await fetch(`/api/register/user/${encodeURIComponent(targetId)}`).then(r => r.json()).catch(() => null);
            if (uRes?.ok && uRes.user) { selectMember(uRes.user, localMap); return; }
          }
          if (members.length > 0) selectMember(members[0], localMap);
          else setDrawerOpen(true);
        }
        load();
      }, []);

      const handleCardMove = (e) => {
        if (!window.matchMedia('(hover: hover)').matches || !cardRef.current) return;
        const r = cardRef.current.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width;
        const py = (e.clientY - r.top) / r.height;
        const rx = (0.5 - py) * 10;
        const ry = (px - 0.5) * 10;
        setTiltStyle({
          transform: `perspective(950px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`,
          '--gx': `${(px * 100).toFixed(1)}%`,
          '--gy': `${(py * 100).toFixed(1)}%`,
          '--gop': 0.85
        });
      };

      const handleCardLeave = () => {
        setTiltStyle({
          transform: 'perspective(950px) rotateX(0deg) rotateY(0deg)',
          '--gx': '50%', '--gy': '50%', '--gop': 0
        });
      };

      const assignDrink = (slotKey, itemName, clientX, clientY) => {
        setSlots(prev => {
          const next = { ...prev, [slotKey]: itemName };
          if (slotKey === 'favorite' && !prev.liked1) setActiveSlot('liked1');
          else if (slotKey === 'liked1' && !prev.liked2) setActiveSlot('liked2');
          return next;
        });
        if (clientX && clientY) {
          fireSakuraConfetti(clientX / window.innerWidth, clientY / window.innerHeight, 18);
        }
      };

      const startPointerDrag = (e, item) => {
        if (e.button && e.button !== 0) return;
        const startX = e.clientX, startY = e.clientY;
        let dragging = false;
        const timer = setTimeout(() => {
          dragging = true;
          setDragGhost({ item, x: startX, y: startY });
        }, e.pointerType === 'mouse' ? 80 : 180);

        const onMove = (ev) => {
          const moved = Math.abs(ev.clientX - startX) > 5 || Math.abs(ev.clientY - startY) > 5;
          if (!dragging && e.pointerType === 'mouse' && moved) {
            clearTimeout(timer);
            dragging = true;
          }
          if (!dragging) return;
          ev.preventDefault();
          setDragGhost({ item, x: ev.clientX, y: ev.clientY });
          const dropEl = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.drop-slot');
          setHoverSlot(dropEl?.dataset?.slot || null);
        };

        const onUp = (ev) => {
          clearTimeout(timer);
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointercancel', onUp);
          if (dragging) {
            const dropEl = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.drop-slot');
            if (dropEl?.dataset?.slot) assignDrink(dropEl.dataset.slot, item.name, ev.clientX, ev.clientY);
          } else {
            assignDrink(activeSlot, item.name, ev.clientX, ev.clientY);
          }
          setDragGhost(null);
          setHoverSlot(null);
        };

        window.addEventListener('pointermove', onMove, { passive: false });
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
      };

      const monthObj = MONTHS.find(m => m.num === Number(curMonth)) || MONTHS[0];
      const safeDay = curDay && curDay > monthObj.days ? monthObj.days : curDay;

      const displayedDrinks = useMemo(() => {
        const q = menuQuery.trim().toLowerCase();
        if (q) {
          const all = [];
          categories.forEach(c => (c.items || []).forEach(it => {
            if (it.name.toLowerCase().includes(q) || (it.tierCode && it.tierCode.toLowerCase().includes(q))) all.push(it);
          }));
          return all;
        }
        return categories.find(c => c.id === activeCatId)?.items || [];
      }, [categories, activeCatId, menuQuery]);

      const filteredMembers = useMemo(() => {
        const q = memberQuery.trim().toLowerCase();
        return eligibleMembers.filter(m => !q || m.displayName.toLowerCase().includes(q) || m.username.toLowerCase().includes(q)).slice(0, 50);
      }, [eligibleMembers, memberQuery]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!currentUser?.discordId) return setToast({ ok: false, text: 'กรุณาเลือกบัญชีของคุณก่อนค่ะ' });
        if (currentUser.hasMemberRole) return setToast({ ok: false, text: 'บัญชีนี้มียศสมาชิกอยู่แล้วค่ะ' });
        if (!safeDay) return setToast({ ok: false, text: 'กรุณาเลือกวันที่เกิดในปฏิทินก่อนนะคะ 🎂' });
        if (pin.length !== 4) return setToast({ ok: false, text: 'กรุณาตั้งรหัส PIN ให้ครบ 4 หลักค่ะ' });

        setSubmitting(true);
        setToast(null);
        try {
          const res = await fetch('/api/register/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              discordId: currentUser.discordId,
              nickname: nickname.trim(),
              birthdayDay: safeDay,
              birthdayMonth: curMonth,
              favoriteMenu: slots.favorite || 'ขอคิดดูก่อน',
              likedMenu1: slots.liked1 || 'ขอคิดดูก่อน',
              likedMenu2: slots.liked2 || 'ขอคิดดูก่อน',
              pin
            })
          });
          const data = await res.json();
          if (!data.ok) {
            setToast({ ok: false, text: data.error || 'บันทึกไม่สำเร็จค่ะ' });
          } else {
            fireSakuraConfetti(0.5, 0.55, 95);
            setToast({ ok: true, text: data.message });
            if (data.user) setCurrentUser(data.user);
          }
        } catch (err) {
          setToast({ ok: false, text: 'การเชื่อมต่อขัดข้อง ลองใหม่อีกครั้งนะคะ' });
        } finally {
          setSubmitting(false);
        }
      };

      const renderDrinkBadge = (name, placeholder) => {
        if (!name) return <span className="slot-placeholder">{placeholder}</span>;
        const info = menuMap.get(name) || { icon: '🍹', tierCode: 'C' };
        const tClass = info.tierCode === '?' ? 'MYSTERY' : info.tierCode;
        return (
          <span>
            {info.icon} {name} <span className={`tier-pill tier-${tClass}`}>{info.tierCode}</span>
          </span>
        );
      };

      return (
        <div className="page-shell">
          <motion.nav
            initial={{ opacity: 0, y: -14 }}
            animate={{ opacity: 1, y: 0 }}
            className="top-nav glass-panel"
          >
            <div className="brand">
              <div className="brand-orb"><Sparkles size={22} /></div>
              <div>
                <h1>Horizontal Cafe • Aesthetic Member Card</h1>
                <p>ระบบลงทะเบียนบัตรสมาชิกโฮโลแกรม (เฉพาะผู้ที่ยังไม่มีบัตรสมาชิก)</p>
              </div>
            </div>
          </motion.nav>

          <div className="portal-grid">
            {/* คอลัมน์ซ้าย: บัตรสมาชิก Holographic 3D แสดงชื่อเมนูเต็มทุกตัวอักษร */}
            <div className="sticky-col">
              <div
                ref={cardRef}
                onMouseMove={handleCardMove}
                onMouseLeave={handleCardLeave}
                className="id-card"
                style={{ ...tiltStyle, '--role-color': currentUser?.roleColor || '#FF8DA1' }}
              >
                <div className="holo-foil-layer" />
                <div className="holo-rainbow-border" />
                <div className="id-card-aura" />

                <div className="badge-row">
                  <span className={`pill ${currentUser?.hasMemberRole ? 'locked' : 'ready'}`}>
                    {currentUser?.hasMemberRole ? '✅ มียศสมาชิกแล้ว' : '🪪 พร้อมลงทะเบียนรับยศ'}
                  </span>
                  <span className={`pill ${pin.length === 4 ? 'locked' : ''}`}>
                    <ShieldCheck size={13} /> PIN {pin.length}/4
                  </span>
                </div>

                <motion.div whileHover={{ scale: 1.06, rotate: -2 }} className="avatar-wrap">
                  <img src={currentUser?.avatarUrl || 'https://cdn.discordapp.com/embed/avatars/0.png'} alt="Avatar" />
                </motion.div>

                <div className="server-name">{currentUser?.displayName || 'กำลังดึงข้อมูลของคุณ...'}</div>
                <div className="discord-tag">@{currentUser?.username || 'discord_user'}</div>

                <motion.button
                  type="button"
                  whileHover={{ scale: 1.04 }}
                  whileTap={{ scale: 0.96 }}
                  onClick={() => setDrawerOpen(!drawerOpen)}
                  className="not-me-btn"
                >
                  <RefreshCw size={13} /> ไม่ใช่ฉัน? (เลือกบัญชีที่ยังไม่ได้ลงทะเบียน)
                </motion.button>

                <div className="live-grid">
                  <div className="live-box nick-theme">
                    <div className="live-label">🏷️ ชื่อเล่นประจำคาเฟ่</div>
                    <motion.div key={nickname} initial={{ scale: 0.94 }} animate={{ scale: 1 }} className="live-val">
                      {nickname.trim() || 'รอตั้งชื่อเล่น...'}
                    </motion.div>
                  </div>
                  <div className="live-box bday-theme">
                    <div className="live-label">🎂 วันเกิดสมาชิก</div>
                    <motion.div key={`${safeDay}-${curMonth}`} initial={{ scale: 0.94 }} animate={{ scale: 1 }} className="live-val">
                      {safeDay ? `${safeDay} ${monthObj.name}` : 'เลือกในปฏิทิน'}
                    </motion.div>
                  </div>
                </div>

                <div className="showcase-box">
                  <div className="showcase-title">🍹 เครื่องดื่มประจำตัวบนบัตรสมาชิก</div>
                  <div className="showcase-row">
                    <span className="s-label">⭐ เมนูโปรด</span>
                    <span className="s-name">{renderDrinkBadge(slots.favorite, '🍵 รอลากเมนูมาวาง')}</span>
                  </div>
                  <div className="showcase-row">
                    <span className="s-label">💖 เมนูที่ชอบ</span>
                    <span className="s-name">{renderDrinkBadge(slots.liked1, '🍵 รอลากเมนูมาวาง')}</span>
                  </div>
                  <div className="showcase-row">
                    <span className="s-label">🎲 อาจจะสั่ง</span>
                    <span className="s-name">{renderDrinkBadge(slots.liked2, '🍵 รอลากเมนูมาวาง')}</span>
                  </div>
                </div>
              </div>

              <AnimatePresence>
                {drawerOpen && (
                  <motion.div
                    initial={{ opacity: 0, height: 0 }}
                    animate={{ opacity: 1, height: 'auto' }}
                    exit={{ opacity: 0, height: 0 }}
                    className="not-me-drawer glass-panel"
                  >
                    <div className="sec-title">
                      <span>🔍 เลือกบัญชีของคุณ (เฉพาะผู้ยังไม่มียศสมาชิก)</span>
                      <span className="sec-hint">{eligibleMembers.length} ท่าน</span>
                    </div>
                    <input
                      type="text"
                      className="search-box"
                      placeholder="พิมพ์ค้นหาชื่อในเซิร์ฟเวอร์..."
                      value={memberQuery}
                      onChange={e => setMemberQuery(e.target.value)}
                    />
                    <div className="member-scroll">
                      {filteredMembers.map(m => (
                        <motion.div
                          key={m.discordId}
                          whileHover={{ x: 4 }}
                          onClick={() => { selectMember(m); setDrawerOpen(false); }}
                          className={`member-item ${currentUser?.discordId === m.discordId ? 'selected' : ''}`}
                        >
                          <div className="m-left">
                            <img src={m.avatarUrl} alt="" />
                            <div>
                              <div className="m-name">{m.displayName}</div>
                              <div className="sec-hint">@{m.username}</div>
                            </div>
                          </div>
                          <span className="pill ready">เลือกฉัน</span>
                        </motion.div>
                      ))}
                    </div>
                  </motion.div>
                )}
              </AnimatePresence>
            </div>

            {/* คอลัมน์ขวา: แบบฟอร์มหัวข้ออิโมจิ */}
            <motion.div
              initial={{ opacity: 0, y: 18 }}
              animate={{ opacity: 1, y: 0 }}
              className="form-panel glass-panel"
            >
              <form onSubmit={handleSubmit} autoComplete="off">
                <div className="field-block">
                  <label className="sec-title">
                    <span>🏷️ ตั้งชื่อเล่นประจำคาเฟ่</span>
                    <span className="sec-hint">แสดงสดบนบัตรสมาชิก (1–35 ตัวอักษร)</span>
                  </label>
                  <input
                    type="text"
                    className="text-input"
                    maxLength={35}
                    placeholder="เช่น เอ, มาย, เมฆ..."
                    value={nickname}
                    onChange={e => setNickname(e.target.value)}
                    required
                  />
                </div>

                <div className="field-block">
                  <label className="sec-title">
                    <span>🎂 เลือกวันเกิดของคุณ</span>
                    <span className="sec-hint" style={{ fontWeight: 700, color: '#B56576' }}>
                      <CalendarHeart size={14} style={{ verticalAlign: 'middle' }} />{' '}
                      {safeDay ? `${safeDay} ${monthObj.name}` : 'ยังไม่ได้เลือกวันเกิด'}
                    </span>
                  </label>
                  <div className="real-calendar">
                    <div className="cal-top-bar">
                      <button
                        type="button"
                        onClick={() => setCurMonth(curMonth === 1 ? 12 : curMonth - 1)}
                        className="cal-nav-btn"
                      >
                        <ChevronLeft size={18} />
                      </button>
                      <select
                        value={curMonth}
                        onChange={e => setCurMonth(Number(e.target.value))}
                        className="cal-month-select"
                      >
                        {MONTHS.map(m => (
                          <option key={m.num} value={m.num}>📅 เดือน{m.name}</option>
                        ))}
                      </select>
                      <button
                        type="button"
                        onClick={() => setCurMonth(curMonth === 12 ? 1 : curMonth + 1)}
                        className="cal-nav-btn"
                      >
                        <ChevronRight size={18} />
                      </button>
                    </div>
                    <div className="cal-weekdays">
                      <span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span>
                    </div>
                    <motion.div
                      key={curMonth}
                      initial={{ opacity: 0.25, y: 5 }}
                      animate={{ opacity: 1, y: 0 }}
                      className="cal-days-body"
                    >
                      {Array.from({ length: monthObj.offset }).map((_, idx) => (
                        <div key={`e-${idx}`} className="cal-cell empty" />
                      ))}
                      {Array.from({ length: monthObj.days }, (_, idx) => idx + 1).map(d => (
                        <motion.button
                          key={d}
                          type="button"
                          whileHover={{ y: -2 }}
                          whileTap={{ scale: 0.92 }}
                          onClick={() => setCurDay(d)}
                          className={`cal-cell ${safeDay === d ? 'selected' : ''}`}
                        >
                          {d}
                        </motion.button>
                      ))}
                    </motion.div>
                  </div>
                </div>

                <div className="field-block">
                  <label className="sec-title">
                    <span>🍹 เลือกเครื่องดื่มประจำตัว (กดค้างแล้วลากมาวางในช่องได้เลย)</span>
                    <span className="sec-hint"><Coffee size={13} style={{ verticalAlign: 'middle' }} /> เฉพาะหมวดเครื่องดื่ม</span>
                  </label>

                  <div className="drop-slots-grid">
                    {[
                      { key: 'favorite', title: '⭐ เมนูโปรด', cls: '' },
                      { key: 'liked1', title: '💖 เมนูที่ชอบ', cls: 'slot-liked1' },
                      { key: 'liked2', title: '🎲 เมนูที่อาจจะสั่ง', cls: 'slot-liked2' }
                    ].map(s => (
                      <motion.div
                        key={s.key}
                        layout
                        data-slot={s.key}
                        onClick={() => setActiveSlot(s.key)}
                        className={`drop-slot ${s.cls} ${activeSlot === s.key ? 'active-target' : ''} ${hoverSlot === s.key ? 'drag-over' : ''}`}
                      >
                        <div className="slot-head">
                          <span>{s.title}</span>
                          {slots[s.key] && (
                            <button
                              type="button"
                              onClick={(e) => { e.stopPropagation(); setSlots(p => ({ ...p, [s.key]: '' })); }}
                              className="slot-clear"
                            >
                              <Trash2 size={12} /> ล้าง
                            </button>
                          )}
                        </div>
                        <div className="slot-body">
                          {renderDrinkBadge(slots[s.key], 'ลากเครื่องดื่มมาวาง...')}
                        </div>
                      </motion.div>
                    ))}
                  </div>

                  <div className="catalog-box">
                    <div className="catalog-toolbar">
                      <div className="search-wrap">
                        <Search size={15} color="#8C5361" />
                        <input
                          type="text"
                          className="toolbar-search"
                          placeholder="ค้นหาชื่อเครื่องดื่ม หรือระดับ SSR, SR..."
                          value={menuQuery}
                          onChange={e => setMenuQuery(e.target.value)}
                        />
                      </div>
                      <div className="toolbar-divider" />
                      <div className="cat-tabs">
                        {categories.map(cat => {
                          const shortLabel = cat.id === 'coffee' ? 'กาแฟ' : cat.id === 'tea' ? 'ชา' : cat.id === 'other_drink' ? 'ม็อกเทล/สมูทตี้' : 'เมนูพิเศษ';
                          return (
                            <button
                              key={cat.id}
                              type="button"
                              onClick={() => { setMenuQuery(''); setActiveCatId(cat.id); }}
                              className={`cat-tab ${!menuQuery && activeCatId === cat.id ? 'active' : ''}`}
                            >
                              {cat.icon || '🍹'} {shortLabel}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <div className="catalog-section-divider">
                      ✨ รายการเครื่องดื่มคาเฟ่ (กดค้างเพื่อลาก หรือคลิกเลือก) ✨
                    </div>

                    <div className="menu-grid">
                      {displayedDrinks.map(item => {
                        const tClass = item.tierCode === '?' ? 'MYSTERY' : item.tierCode;
                        return (
                          <motion.div
                            key={`${item.categoryId}-${item.name}`}
                            whileHover={{ y: -2, scale: 1.01 }}
                            whileTap={{ scale: 0.96 }}
                            onPointerDown={e => startPointerDrag(e, item)}
                            className="menu-chip"
                          >
                            <span className="m-chip-name">{item.icon || '🍹'} {item.name}</span>
                            <span className="chip-v-sep" />
                            <span className={`tier-pill tier-${tClass}`}>{item.tierCode}</span>
                          </motion.div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                <div className="field-block">
                  <label className="sec-title">
                    <span>🔐 ตั้งรหัส PIN 4 หลัก (รับยศกุญแจนิรภัย)</span>
                    <span className="sec-hint">ตัวเลข 4 หลักเท่านั้น</span>
                  </label>
                  <div className="pin-wrap">
                    <input
                      type={showPin ? 'text' : 'password'}
                      className="text-input pin-input-4"
                      inputMode="numeric"
                      maxLength={4}
                      placeholder="••••"
                      value={pin}
                      onChange={e => setPin(e.target.value.replace(/\D/g, '').slice(0, 4))}
                      required
                    />
                    <button type="button" onClick={() => setShowPin(!showPin)} className="eye-btn">
                      {showPin ? <EyeOff size={16} /> : <Eye size={16} />}
                    </button>
                    <div className="pin-dots">
                      {[0, 1, 2, 3].map(i => (
                        <span key={i} className={`pin-dot ${i < pin.length ? 'filled' : ''}`} />
                      ))}
                    </div>
                  </div>
                </div>

                <motion.button
                  type="submit"
                  whileHover={{ scale: 1.01, y: -2 }}
                  whileTap={{ scale: 0.98 }}
                  disabled={submitting || currentUser?.hasMemberRole}
                  className="submit-btn"
                >
                  <Sparkles size={18} />
                  {currentUser?.hasMemberRole
                    ? 'บัญชีนี้มียศสมาชิกแล้ว (กด "ไม่ใช่ฉัน?" เพื่อเปลี่ยนบัญชี)'
                    : submitting
                    ? 'กำลังบันทึกบัตรสมาชิกและมอบยศ...'
                    : 'ยืนยันลงทะเบียนบัตรสมาชิก & รับยศทันที'}
                </motion.button>

                {toast && (
                  <motion.div
                    initial={{ opacity: 0, y: 8 }}
                    animate={{ opacity: 1, y: 0 }}
                    className={`toast ${toast.ok ? 'ok' : 'err'}`}
                  >
                    {toast.text}
                  </motion.div>
                )}
              </form>
            </motion.div>
          </div>

          {dragGhost && (
            <div className="drag-ghost" style={{ left: dragGhost.x, top: dragGhost.y }}>
              <span>{dragGhost.item.icon || '🍹'}</span>
              <span>{dragGhost.item.name}</span>
            </div>
          )}
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<RegisterPortalApp />);
  </script>
</body>
</html>
