<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>📖 สมุดเมนูพิเศษ — Horizontal Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Kanit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "@iconify/react": "https://esm.sh/@iconify/react@5.0.2?external=react,react-dom"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <style>
    :root {
      --font-display: 'Kanit', sans-serif;
      --font-body: 'IBM Plex Sans Thai', sans-serif;
      --canvas-top: #FAF6F0;
      --canvas-bottom: #F4ECE2;
      --surface-panel: rgba(255, 253, 249, 0.88);
      --ink-primary: #3A231E;
      --ink-muted: #6F534B;
      --accent-rose: #B56576;
      --accent-gold: #D48A27;
      --border-oat: rgba(181, 101, 118, 0.26);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-body);
      color: var(--ink-primary);
      background: linear-gradient(165deg, var(--canvas-top) 0%, var(--canvas-bottom) 55%, #F8EFE6 100%);
      background-attachment: fixed;
      margin: 0;
      min-height: 100dvh;
    }

    h1, h2, h3, .font-display {
      font-family: var(--font-display);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .oat-panel {
      background: var(--surface-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--border-oat);
      box-shadow: 0 14px 34px -12px rgba(74, 37, 48, 0.11), inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    @keyframes shimmerHolo {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .holo-frame {
      background: linear-gradient(125deg, #F694C1, #F6D06F, #7BDFF2, #C3A6FF, #F694C1);
      background-size: 280% 280%;
      animation: shimmerHolo 6s ease infinite;
      padding: 2px;
    }

    .ssr-frame {
      background: linear-gradient(135deg, #E8B44C, #FFF0B8, #C98222, #F4D272);
      background-size: 220% 220%;
      animation: shimmerHolo 5s ease infinite;
      padding: 2px;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-pop {
      animation: popIn 0.22s ease-out forwards;
    }

    .drink-card-surface {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 20px -10px rgba(58, 35, 30, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }
    .drink-card-surface:hover {
      box-shadow: 0 16px 30px -12px rgba(58, 35, 30, 0.20), inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useMemo, useCallback } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Icon } from '@iconify/react';

    // ==========================================
    // 🔎 ตัวช่วยค้นหาภาษาไทยแบบยืดหยุ่นบนหน้าเว็บ (เพื่อให้หาชื่อเป๊ะๆ ได้ง่ายที่สุด)
    // ==========================================
    function normalizeSearchThai(str) {
      if (!str) return '';
      return String(str)
        .toLowerCase()
        .replace(/[\u0E47-\u0E4E]/g, '')
        .replace(/[\s.,!?~()[\]{}"'`/\\-]/g, '')
        .replace(/ชอคโกแลต|ชอกโกแลต|ชอคโคแลต|ชอกโคแลต|ชอคแลต/g, 'ชอกโกแลต')
        .replace(/ชอค/g, 'ชอก')
        .replace(/สตรอวเบอรี|สตรอเบอรี|สตอเบอรี|สตรอวเบอริ|สตรอเบอริ|สตอเบอริ/g, 'สตอเบอรี')
        .replace(/ราสปเบอรี|ราสเบอรี|ราสปเบอริ|ราสเบอริ/g, 'ราสเบอรี')
        .replace(/เบอรี|เบอริ/g, 'เบอรี')
        .replace(/พิสตาชิโอ|พิตาชิโอ|พิซตาชิโอ/g, 'พิตาชิโอ')
        .replace(/ทีรามิสุ|ทิรามิสุ|ทีรามิซู/g, 'ทีรามิสุ')
        .replace(/วานิลลา|วานิลา|วนิลา/g, 'วานิลา')
        .replace(/มัทฉะ|มัจฉะ|มัตฉะ|มัทชะ/g, 'มัทฉะ')
        .replace(/เอสเพรสโซ|เอสเปรสโซ|เอสเพลสโซ|เอสเปลสโซ|เอสเย็น/g, 'เอสเพรสโซ')
        .replace(/เปปเปอรมินต|เปเปอรมินต|เปปเปอมินต|เปเปอมินต|เปปเปอรมิน|เปปเปอมิน/g, 'เปปเปอรมินต')
        .replace(/มินต|มินท/g, 'มินต')
        .replace(/มอคกา|มอคคา/g, 'มอคคา')
        .replace(/คาปูชิโน|คาปุชิโน|คาปู/g, 'คาปูชิโน')
        .replace(/อเมริกาโน|อะเมอริกาโน|กาแฟดำ/g, 'อเมริกาโน')
        .replace(/ลาเวนเดอร|ลาเวเดอร/g, 'ลาเวนเดอร')
        .replace(/คุกกี|คุกกิ|cookie/g, 'คุกกี')
        .replace(/เยลลี|เจลลี|เยลลิ|เจลลิ/g, 'เจลลี')
        .replace(/ยูซุ|ยุสุ|ยูสุ/g, 'ยูซุ')
        .replace(/นิวหยอก|นิวยอก|นิวยอรก|newyork/g, 'นิวยอรก')
        .replace(/ครัวซองต|ครัวซอง/g, 'ครัวซอง')
        .replace(/ฮันนีโทสต|ฮันนีโทส|โทสต/g, 'ฮันนีโทส')
        .replace(/วิปปิงครีม|วิปครีม/g, 'วิปครีม')
        .replace(/ไอศกรีม|ไอติม/g, 'ไอศกรีม')
        .replace(/บราวนี|บราวนิ/g, 'บราวนี')
        .replace(/เลมอน|มะนาว/g, 'เลมอน')
        .replace(/กาแฟ/g, 'คอฟฟี')
        .replace(/ชาเย็น/g, 'ชาไทย')
        .replace(/ชาเขียว/g, 'มัทฉะ');
    }

    const SEARCH_SYNONYMS = {
      'คอฟฟีสม': ['แบล็คออเรนจ์', 'อเมริกาโน่ส้ม', 'อเมริกาโน่น้ำส้ม', 'ยูซุอเมริกาโน่'],
      'คอฟฟีมะพราว': ['โคโคนัทคลาวด์', 'อเมริกาโน่น้ำมะพร้าว', 'อเมริกาโน่มะพร้าว'],
      'คอฟฟีพีช': ['พีชบลอสซั่ม', 'อเมริกาโน่พีช'],
      'มัทฉะคอฟฟี': ['มัทฉะเอสเพรสโซ่'],
      'ชาไทยคอฟฟี': ['ชาไทยเอสเพรสโซ่', 'เดอร์ตี้ชาไทยลาเต้เอสเพรสโซ่'],
      'ชาไทยโกโก': ['ชาไทยโกโก้', 'ชาไทยดาร์กโกโก้', 'ชาไทยวัลโรนาช็อกโกแลต'],
      'ชาไทยชอก': ['ชาไทยโกโก้', 'ชาไทยดาร์กโกโก้', 'ชาไทยวัลโรนาช็อกโกแลต'],
      'ชาไทยชอกโกแลต': ['ชาไทยโกโก้', 'ชาไทยดาร์กโกโก้', 'ชาไทยวัลโรนาช็อกโกแลต'],
      'มัทฉะโกโก': ['โกโก้มัทฉะ', 'ไวท์ช็อกโกแลตมัทฉะ', 'ดาร์กโกโก้อูจิมัทฉะ'],
      'มัทฉะมะพราว': ['เพียวมัทฉะน้ำมะพร้าว', 'มัทฉะมะพร้าวคั่ว', 'มัทฉะน้ำมะพร้าว', 'อูจิมัทฉะน้ำมะพร้าว'],
      'มัทฉะยูซุ': ['เพียวมัทฉะน้ำผึ้งยูซุ', 'มัทฉะยูซุ', 'อูจิมัทฉะยูซุ', 'มัทฉะเอสเพรสโซ่โคลด์บรูว์ยูซุ'],
      'ชานมโกโก': ['ชานมไต้หวันโกโก้', 'ชานมไต้หวันดาร์กโกโก้', 'ชานมไต้หวันอู่หลงเบลเยียมโกโก้'],
      'ชานมชอก': ['ชานมไต้หวันโกโก้', 'ชานมไต้หวันดาร์กโกโก้', 'ชานมไต้หวันอู่หลงเบลเยียมโกโก้'],
      'มินตมอคคา': ['เปปเปอร์มิ้นต์มอคค่า', 'เดอร์ตี้เปปเปอร์มิ้นต์ดาร์กมอคค่า'],
      'เปปเปอรมินต': ['เปปเปอร์มิ้นต์มอคค่า', 'เดอร์ตี้เปปเปอร์มิ้นต์ดาร์กมอคค่า'],
      'ฟองนม': ['ฮอกไกโดมิลค์โฟม', 'คาราเมลมัคคิอาโต้โฟม'],
      'ชีส': ['ครีมชีส', 'ชีสเค้ก', 'ชีสพาย']
    };

    function detectDrinkStyles(name) {
      const styles = [];
      if (/ปั่น|เฟรปเป้|สเลอปี้|สมูทตี้|เกล็ดหิมะ|มิลค์เชค|โฟลต/.test(name)) styles.push('blended');
      if (/ร้อน|อุ่น/.test(name)) styles.push('hot');
      if (/โซดา|สปาร์คกลิ้ง|โทนิค|ฟิซ|สไปรท์|เลมอนเนด/.test(name)) styles.push('soda');
      if (
        /เดอร์ตี้|ฟิวชัน|ทูโทน|หยวนหยาง|เอสเพรสโซ่.*(มัทฉะ|ชาไทย|โฮจิฉะ|โกโก้)|(มัทฉะ|ชาไทย|โฮจิฉะ|โกโก้).*เอสเพรสโซ่|โกโก้มัทฉะ|ไวท์ช็อกโกแลตมัทฉะ|ชาไทย.*(โกโก้|ช็อกโกแลต)|ชานมไต้หวัน.*โกโก้|มัทฉะ.*(มะพร้าว|ยูซุ|สตรอว์เบอร์รี|ไวท์ทรัฟเฟิล)|เปปเปอร์มิ้นต์.*มอคค่า|อเมริกาโน่.*(ส้ม|พีช|มะพร้าว|ยูซุ)|แบล็คออเรนจ์|พีชบลอสซั่มอเมริกาโน่|ยูซุอเมริกาโน่|ลิ้นจี่เอสเพรสโซ่|สตรอว์เบอร์รีดาร์กโกโก้/.test(name)
      ) {
        styles.push('fusion');
      }
      if (/เย็น|โคลด์บรูว์|สกัดเย็น|ออนเดอะร็อก|แยกชั้น/.test(name) || (!styles.includes('hot') && !styles.includes('blended'))) {
        styles.push('iced');
      }
      return styles;
    }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) {}
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (_) {
        return false;
      }
    }

    const CATEGORY_META = {
      all: { label: 'ทั้งหมด', emojiIcon: 'fluent-emoji:sparkles' },
      create_one: { label: 'Create one (?)', emojiIcon: 'fluent-emoji:rainbow' },
      coffee: { label: 'กาแฟ & ฟิวชัน', emojiIcon: 'fluent-emoji:hot-beverage' },
      tea: { label: 'ชา & มัทฉะ', emojiIcon: 'fluent-emoji:teacup-without-handle' },
      other_drink: { label: 'น้ำหวาน & สมูทตี้', emojiIcon: 'fluent-emoji:tropical-drink' },
      topping: { label: 'ท็อปปิ้ง', emojiIcon: 'fluent-emoji:bubble-tea' },
      dessert: { label: 'ขนม & เบเกอรี', emojiIcon: 'fluent-emoji:shortcake' }
    };

    const STYLE_FILTERS = [
      { id: 'all', label: 'ทุกสไตล์', icon: 'solar:cup-star-bold-duotone' },
      { id: 'iced', label: 'เย็น', icon: 'solar:snowflake-bold-duotone' },
      { id: 'blended', label: 'ปั่น / เฟรปเป้', icon: 'solar:tornado-bold-duotone' },
      { id: 'hot', label: 'ร้อน / อุ่น', icon: 'solar:flame-bold-duotone' },
      { id: 'soda', label: 'โซดา / ซ่า', icon: 'solar:bolt-circle-bold-duotone' },
      { id: 'fusion', label: 'ฟิวชัน / เดอร์ตี้', icon: 'solar:magic-stick-3-bold-duotone' }
    ];

    const TIER_FILTERS = ['ALL', '?', 'SSR', 'SR', 'R', 'C'];

    const SWEETNESS_PRESETS = [
      'หวานปกติ',
      'หวานน้อย 25%',
      'หวานกำลังดี 50%',
      'ไม่หวาน',
      'หวานมากกกก'
    ];

    function getTierBadgeMeta(tierCode) {
      switch (tierCode) {
        case '?':
          return {
            badge: 'bg-gradient-to-r from-pink-500 via-amber-400 to-cyan-500 text-white shadow-sm',
            frameClass: 'holo-frame',
            tagText: '? • Create one'
          };
        case 'SSR':
          return {
            badge: 'bg-gradient-to-r from-amber-500 to-yellow-400 text-[#3A231E] font-bold shadow-sm',
            frameClass: 'ssr-frame',
            tagText: 'SSR'
          };
        case 'SR':
          return {
            badge: 'bg-white/85 text-[#9B3B5A] border border-[#E6B3C2]',
            frameClass: '',
            tagText: 'SR'
          };
        case 'R':
          return {
            badge: 'bg-white/85 text-[#256D85] border border-[#B3DAE6]',
            frameClass: '',
            tagText: 'R'
          };
        default:
          return {
            badge: 'bg-white/85 text-[#6F534B] border border-[#DEC9B8]',
            frameClass: '',
            tagText: 'C'
          };
      }
    }

    function App() {
      const [loading, setLoading] = useState(true);
      const [errorMsg, setErrorMsg] = useState('');
      const [categories, setCategories] = useState([]);
      const [stats, setStats] = useState({ totalAll: 0, totalDrinks: 0, totalToppings: 0, totalDesserts: 0, totalMystery: 0 });
      const [coinText, setCoinText] = useState('เหรียญทอง');

      // ฟิลเตอร์
      const [search, setSearch] = useState('');
      const [activeCat, setActiveCat] = useState('all');
      const [activeStyle, setActiveStyle] = useState('all');
      const [activeTier, setActiveTier] = useState('ALL');
      const [onlyFavorites, setOnlyFavorites] = useState(false);

      // ปักหมุดเมนูประจำตัว
      const [favorites, setFavorites] = useState(() => {
        try {
          const raw = localStorage.getItem('hc_menu_favorites');
          return raw ? JSON.parse(raw) : [];
        } catch (_) {
          return [];
        }
      });

      // ถาดจัดชุดออเดอร์ (Order Builder)
      const [selectedDrink, setSelectedDrink] = useState(null);
      const [sweetness, setSweetness] = useState('หวานปกติ');
      const [selectedTopping, setSelectedTopping] = useState(null);
      const [selectedDessert, setSelectedDessert] = useState(null);
      const [trayExpanded, setTrayExpanded] = useState(false);

      // Toast & Copy state
      const [toast, setToast] = useState(null);
      const [justCopiedName, setJustCopiedName] = useState('');

      useEffect(() => {
        try { localStorage.setItem('hc_menu_favorites', JSON.stringify(favorites)); } catch (_) {}
      }, [favorites]);

      const showToast = useCallback((text, sub = '') => {
        setToast({ text, sub, id: Date.now() });
      }, []);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2600);
        return () => clearTimeout(t);
      }, [toast]);

      // โหลดข้อมูลสมุดเมนูจาก API (พร้อม theColor และ description)
      useEffect(() => {
        let alive = true;
        async function loadCatalog() {
          try {
            setLoading(true);
            const res = await fetch('/api/menu/catalog', { cache: 'no-store' });
            const data = await res.json();
            if (!alive) return;
            if (!data.ok) throw new Error(data.error || 'โหลดข้อมูลไม่สำเร็จ');
            setCategories(Array.isArray(data.categories) ? data.categories : []);
            setStats(data.stats || {});
            if (data.coinText) setCoinText(data.coinText);
          } catch (err) {
            if (alive) setErrorMsg(err.message || 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
          } finally {
            if (alive) setLoading(false);
          }
        }
        loadCatalog();
        return () => { alive = false; };
      }, []);

      // รวมรายการทั้งหมดพร้อม metadata สำหรับกรอง
      const allItems = useMemo(() => {
        const list = [];
        categories.forEach((cat) => {
          (cat.items || []).forEach((item) => {
            const typeKey = cat.typeKey || 'drink';
            list.push({
              ...item,
              typeKey,
              catId: cat.id,
              fuzzyName: normalizeSearchThai(item.name),
              fuzzyDesc: normalizeSearchThai(item.description || ''),
              styles: typeKey === 'drink' ? detectDrinkStyles(item.name) : []
            });
          });
        });
        return list;
      }, [categories]);

      const pinnedItems = useMemo(() => {
        if (!favorites.length) return [];
        const map = new Map(allItems.map((it) => [it.name, it]));
        return favorites.map((name) => map.get(name)).filter(Boolean);
      }, [favorites, allItems]);

      // กรองรายการตามคำค้นหา หมวด สไตล์ และระดับ Tier
      const filteredItems = useMemo(() => {
        const qFuzzy = normalizeSearchThai(search);
        const rawLower = search.trim().toLowerCase();

        const extraMatchedTargets = [];
        if (qFuzzy) {
          Object.entries(SEARCH_SYNONYMS).forEach(([key, targets]) => {
            if (qFuzzy.includes(key)) {
              targets.forEach((t) => extraMatchedTargets.push(normalizeSearchThai(t)));
            }
          });
        }

        return allItems.filter((item) => {
          if (onlyFavorites && !favorites.includes(item.name)) return false;
          if (activeCat !== 'all' && item.catId !== activeCat) return false;
          if (activeTier !== 'ALL' && item.tierCode !== activeTier) return false;
          if (activeStyle !== 'all') {
            if (item.typeKey !== 'drink') return false;
            if (!item.styles.includes(activeStyle)) return false;
          }
          if (qFuzzy) {
            const directHit =
              item.name.toLowerCase().includes(rawLower) ||
              item.fuzzyName.includes(qFuzzy) ||
              (item.description && item.description.toLowerCase().includes(rawLower)) ||
              item.fuzzyDesc.includes(qFuzzy);
            const synHit = extraMatchedTargets.some((t) => item.fuzzyName.includes(t));
            if (!directHit && !synHit) return false;
          }
          return true;
        });
      }, [allItems, search, activeCat, activeStyle, activeTier, onlyFavorites, favorites]);

      const toggleFavorite = (itemName, e) => {
        if (e) e.stopPropagation();
        setFavorites((prev) =>

        if (item.typeKey === 'drink') {

          setSelectedTopping((prev) => (prev?.name === item.name ? null : item));

          setSelectedDessert((prev) => (prev?.name === item.name ? null : item));

        const drinks = allItems.filter((i) => i.typeKey === 'drink' && !i.isMystery);
        const toppings = allItems.filter((i) => i.typeKey === 'topping');
        const desserts = allItems.filter((i) => i.typeKey === 'dessert');

        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const d = pick(drinks);
        setSelectedDrink(d);
        setSweetness('หวานปกติ');

        if (includeExtras) {
          setSelectedTopping(toppings.length ? pick(toppings) : null);
          setSelectedDessert(desserts.length ? pick(desserts) : null);

          setSelectedDessert(null);

          drinkPart,
          selectedTopping?.name || '',
          selectedDessert?.name || ''

                          onClick={() => handleSelectForBuilder(item)}
                          className={`rounded-2xl cursor-pointer transition-all duration-200 ${tierUI.frameClass} ${
                            isSelected ? 'ring-[2.5px] ring-[#B56576] scale-[1.01]' : 'hover:-translate-y-1'
                          }`}
                        >
                          <div
                            className="h-full rounded-[14.5px] p-4 flex flex-col justify-between gap-3 drink-card-surface"
                            style={{
                              background: cardGradient,
                              border: hasSpecialFrame ? 'none' : `1.5px solid ${cardBorder}`
                            }}
                          >
                            {/* ส่วนบน: แท็ก Tier + หมวด + จุดเฉดสีจริง + ปุ่มหัวใจ */}
                            <div>
                              <div className="flex items-start justify-between gap-2">
                                <div className="flex items-center gap-1.5 flex-wrap">
                                  <span className={`text-[10px] px-2 py-0.5 rounded-full font-display font-bold ${tierUI.badge}`}>
                                    {tierUI.tagText}
                                  </span>
                                  <span className="text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1 bg-white/75 text-[#5A3F38] border border-white/80 font-medium">
                                    <Icon icon={catMeta.emojiIcon} width="12" />
                                    {item.typeKey === 'drink' ? 'เครื่องดื่ม' : item.typeKey === 'topping' ? 'ท็อปปิ้ง' : 'ขนม'}
                                  </span>
                                  {swatchColors.length > 0 && (
                                    <span
                                      className="inline-flex items-center -space-x-1 px-1.5 py-0.5 rounded-full bg-white/70 border border-white/80"
                                      title="เฉดสีชั้นเครื่องดื่ม (บน → ล่าง)"
                                    >
                                      {swatchColors.map((hex, idx) => (
                                        <span
                                          key={`${item.name}-dot-${idx}`}
                                          className="w-2.5 h-2.5 rounded-full border border-black/15"
                                          style={{ backgroundColor: hex }}
                                        />
                                      ))}
                                    </span>
                                  )}
                                </div>

                                <button
                                  onClick={(e) => toggleFavorite(item.name, e)}
                                  className={`p-1.5 rounded-xl bg-white/70 hover:bg-white transition shrink-0 ${
                                    isFav ? 'text-[#D6456B] scale-105' : 'text-[#8C6D64] hover:text-[#D6456B]'
                                  }`}
                                  title={isFav ? 'เอาออกจากที่ปักหมุด' : 'ปักหมุดเมนูประจำตัว'}
                                >
                                  <Icon icon={isFav ? 'solar:heart-bold' : 'solar:heart-linear'} width="17" />
                                </button>
                              </div>

                              {/* ชื่อเมนู */}
                              <h3 className="font-display font-bold text-[15px] sm:text-base mt-2.5 leading-snug break-words text-[#3A231E]">
                                {item.name}
                              </h3>

                              {/* คำอธิบายสั้น (ช่วยให้เข้าใจศัพท์เฉพาะและรสชาติทันที) */}
                              {item.description && (
                                <p className="text-[12px] leading-relaxed text-[#5C4038] mt-1.5 bg-white/45 rounded-xl px-2.5 py-1.5 border border-white/60">
                                  {item.description}
                                </p>
                              )}
                            </div>

                            {/* ส่วนล่าง: ราคาและปุ่มกดบนแถบโปร่งแสงอ่านชัด */}
                            <div className="flex items-center justify-between gap-2 pt-2.5 border-t border-[#3A231E]/10">
                              <div className="inline-flex items-center gap-1 px-2.5 py-1 rounded-xl bg-white/80 border border-white font-display font-bold text-sm text-[#B86E14]">
                                <Icon icon="solar:dollar-minimalistic-bold-duotone" width="16" className="text-[#D48A27]" />
                                <span>{item.isMystery ? (item.priceRangeText || '199 - 999') : item.price.toLocaleString()}</span>
                                <span className="text-[10px] font-medium text-[#7A5E54]">{coinText}</span>
                              </div>

                              <div className="flex items-center gap-1.5">
                                <button
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    handleSelectForBuilder(item);
                                  }}
                                  className={`px-2.5 py-1.5 rounded-xl text-[11px] font-display font-semibold flex items-center gap-1 border transition ${
                                    isSelected
                                      ? 'bg-[#2E9E63] text-white border-transparent shadow-sm'
                                      : 'bg-white/85 text-[#3A231E] border-[#3A231E]/15 hover:bg-white'
                                  }`}
                                >
                                  <Icon icon={isSelected ? 'solar:check-circle-bold' : 'solar:add-circle-bold-duotone'} width="14" />
                                  <span>{isSelected ? 'เลือกแล้ว' : 'ใส่ถาด'}</span>
                                </button>

                                <button
                                  onClick={(e) => handleQuickCopy(item, e)}
                                  className={`px-2.5 py-1.5 rounded-xl text-[11px] font-display font-semibold flex items-center gap-1 transition shadow-sm ${
                                    justCopiedName === item.name
                                      ? 'bg-[#2E9E63] text-white'
                                      : 'bg-[#B56576] text-white hover:bg-[#9C5061]'
                                  }`}
                                >
                                  <Icon icon={justCopiedName === item.name ? 'solar:check-read-bold' : 'solar:copy-bold-duotone'} width="14" />
                                  <span>{justCopiedName === item.name ? 'ก๊อปแล้ว' : 'คัดลอก'}</span>
                                </button>
                              </div>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </section>
            )}
          </main>

          {/* ถาดจัดชุดออเดอร์แบบเรียลไทม์ (Sticky Order Builder — แสดงสีเครื่องดื่มที่เลือก) */}
          {hasBuilderItems && (
            <div className="fixed bottom-0 inset-x-0 z-40 px-3 pb-3 pt-1 pointer-events-none">
              <div className="max-w-3xl mx-auto rounded-3xl border-2 border-[#B56576]/45 bg-[#FFFDF9]/95 text-[#3A231E] shadow-2xl backdrop-blur-xl pointer-events-auto transition-all">
                {/* หัวถาด */}
                <div
                  onClick={() => setTrayExpanded((v) => !v)}
                  className="px-4 py-3 flex items-center justify-between gap-2 cursor-pointer"
                >
                  <div className="flex items-center gap-2.5 min-w-0">
                    <div
                      className="w-9 h-9 rounded-2xl flex items-center justify-center shrink-0 border"
                      style={{
                        background: selectedDrink?.theColor?.gradient || 'linear-gradient(135deg, #FDF0F3, #FBEBC5)',
                        borderColor: selectedDrink?.theColor?.border || '#DDA2B2'
                      }}
                    >
                      <Icon icon="solar:bag-smile-bold-duotone" width="20" className="text-[#3A231E]" />
                    </div>
                    <div className="min-w-0">
                      <div className="font-display font-bold text-xs sm:text-sm flex items-center gap-2">
                        <span>ถาดจัดชุดออเดอร์</span>
                        <span className="text-[#C47A19] font-bold">{totalOrderPriceText} {coinText}</span>
                      </div>
                      <div className="text-[11px] truncate text-[#6F534B]">
                        {builtOrderString || 'ยังไม่ได้เลือกเครื่องดื่มหลัก (กรุณาแตะเลือกน้ำ 1 แก้ว)'}
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center gap-1.5 shrink-0">
                    <button
                      onClick={(e) => {
                        e.stopPropagation();
                        handleCopyBuiltOrder();
                      }}
                      disabled={!selectedDrink}
                      className={`px-3.5 py-2 rounded-2xl text-xs font-display font-semibold flex items-center gap-1.5 transition ${
                        selectedDrink
                          ? 'bg-gradient-to-r from-[#B56576] to-[#D48A27] text-white shadow-md hover:brightness-105 active:scale-95'
                          : 'bg-[#E8DFD7] text-[#9C887E] cursor-not-allowed'
                      }`}
                    >
                      <Icon icon="solar:copy-bold-duotone" width="16" />
                      <span>คัดลอกออเดอร์</span>
                    </button>
                    <button
                      className="w-8 h-8 rounded-xl flex items-center justify-center bg-[#F4EBE2] text-[#3A231E]"
                      aria-label="เปิด/ปิดรายละเอียดถาด"
                    >
                      <Icon icon={trayExpanded ? 'solar:alt-arrow-down-bold' : 'solar:alt-arrow-up-bold'} width="16" />
                    </button>
                  </div>
                </div>

                {/* รายละเอียดถาดเมื่อกดขยาย */}
                {trayExpanded && (
                  <div className="px-4 pb-4 pt-2 border-t border-[#E8DAD0] space-y-3">
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
                      <div
                        className="p-2.5 rounded-2xl border"
                        style={{
                          background: selectedDrink?.theColor?.gradient || '#FAF6F0',
                          borderColor: selectedDrink?.theColor?.border || '#E2D3C7'
                        }}
                      >
                        <div className="text-[10px] text-[#6F534B] mb-1">1. เครื่องดื่มหลัก (บังคับ)</div>
                        {selectedDrink ? (
                          <div className="flex items-center justify-between gap-1 font-semibold text-[#3A231E]">
                            <span className="truncate">{selectedDrink.name}</span>
                            <button onClick={() => setSelectedDrink(null)} className="text-[#B56576] hover:text-[#8E3F54]">
                              <Icon icon="solar:close-circle-bold" width="15" />
                            </button>
                          </div>
                        ) : (
                          <span className="text-[#B56576] font-medium">ยังไม่ได้เลือก</span>
                        )}
                      </div>

                      <div
                        className="p-2.5 rounded-2xl border"
                        style={{
                          background: selectedTopping?.theColor?.gradient || '#FAF6F0',
                          borderColor: selectedTopping?.theColor?.border || '#E2D3C7'
                        }}
                      >
                        <div className="text-[10px] text-[#6F534B] mb-1">2. ท็อปปิ้งเสริม (ไม่บังคับ)</div>
                        {selectedTopping ? (
                          <div className="flex items-center justify-between gap-1 font-semibold text-[#3A231E]">
                            <span className="truncate">{selectedTopping.name}</span>
                            <button onClick={() => setSelectedTopping(null)} className="text-[#B56576] hover:text-[#8E3F54]">
                              <Icon icon="solar:close-circle-bold" width="15" />
                            </button>
                          </div>
                        ) : (
                          <span className="text-[#9B7E75]">ไม่ได้ใส่ท็อปปิ้ง</span>
                        )}
                      </div>

                      <div
                        className="p-2.5 rounded-2xl border"
                        style={{
                          background: selectedDessert?.theColor?.gradient || '#FAF6F0',
                          borderColor: selectedDessert?.theColor?.border || '#E2D3C7'
                        }}
                      >
                        <div className="text-[10px] text-[#6F534B] mb-1">3. ของทานเล่น (ไม่บังคับ)</div>
                        {selectedDessert ? (
                          <div className="flex items-center justify-between gap-1 font-semibold text-[#3A231E]">
                            <span className="truncate">{selectedDessert.name}</span>
                            <button onClick={() => setSelectedDessert(null)} className="text-[#B56576] hover:text-[#8E3F54]">
                              <Icon icon="solar:close-circle-bold" width="15" />
                            </button>
                          </div>
                        ) : (
                          <span className="text-[#9B7E75]">ไม่ได้รับขนม</span>
                        )}
                      </div>
                    </div>

                    {/* เลือกระดับความหวานกำหนดเอง */}
                    <div className="space-y-1.5">
                      <div className="flex items-center justify-between">
                        <span className="text-[11px] font-semibold text-[#6F534B]">ระดับความหวาน (พิมพ์เองได้ เช่น หวานมากกกก, ไม่หวาน)</span>
                        <button onClick={clearBuilder} className="text-[11px] text-[#B56576] font-semibold hover:underline">ล้างถาด</button>
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        {SWEETNESS_PRESETS.map((sw) => (
                          <button
                            key={sw}
                            onClick={() => setSweetness(sw)}
                            className={`px-2.5 py-1 rounded-xl text-[11px] font-semibold border transition ${
                              sweetness === sw
                                ? 'bg-[#B56576] text-white border-[#B56576]'
                                : 'border-[#DECBB9] bg-white text-[#6F534B] hover:bg-[#FAF1E8]'
                            }`}
                          >
                            {sw}
                          </button>
                        ))}
                        <input
                          type="text"
                          value={sweetness}
                          onChange={(e) => setSweetness(e.target.value)}
                          placeholder="พิมพ์ความหวานเอง..."
                          className="flex-1 min-w-[140px] px-3 py-1 rounded-xl text-xs border border-[#DECBB9] bg-[#FAF6F0] focus:bg-white focus:border-[#B56576] text-[#3A231E] outline-none"
                        />
                      </div>
                    </div>

                    {/* ตัวอย่างข้อความจริงที่จะก๊อปไปวางใน Discord */}
                    {builtOrderString && (
                      <div className="p-3 rounded-2xl text-xs font-mono break-all flex items-center justify-between gap-2 bg-[#EEF8F0] text-[#1D5B38] border border-[#9FD3AE]">
                        <span>{builtOrderString}</span>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
