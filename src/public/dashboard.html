<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>☕ Horizontal Cafe | สมุดบันทึกใบเสร็จ & ทำเนียบสมาชิกโฮโลแกรม</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom",
      "lucide-react": "https://esm.sh/lucide-react@0.460.0?external=react",
      "canvas-confetti": "https://esm.sh/canvas-confetti@1.9.3"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-grad-1: #FBEED2;
      --bg-grad-2: #FFD6E0;
      --bg-grad-3: #E5D4FF;
      --bg-grad-4: #DCF5DC;
      --surface-glass: rgba(255, 251, 247, 0.86);
      --surface-card: rgba(255, 255, 255, 0.92);
      --border-soft: rgba(181, 101, 118, 0.34);
      --text-main: #4A2530;
      --text-muted: #8C5361;
      --accent-primary: #B56576;
      --accent-gold: #D48A27;
      --shadow-soft: 0 18px 42px -10px rgba(80, 45, 55, 0.14);
    }

    body[data-ambiance="sunset"] {
      --bg-grad-1: #FFE5D9;
      --bg-grad-2: #FFCAD4;
      --bg-grad-3: #F4ACB7;
      --bg-grad-4: #FBEED2;
      --surface-glass: rgba(255, 248, 244, 0.88);
      --text-main: #43202A;
      --accent-primary: #C95B72;
    }

    body[data-ambiance="night"] {
      --bg-grad-1: #1F1118;
      --bg-grad-2: #2D1824;
      --bg-grad-3: #1B162A;
      --bg-grad-4: #2A1B18;
      --surface-glass: rgba(40, 23, 33, 0.88);
      --surface-card: rgba(52, 30, 43, 0.92);
      --border-soft: rgba(255, 213, 107, 0.32);
      --text-main: #FFF8EB;
      --text-muted: #D8B4C4;
      --accent-primary: #FF8DA1;
      --accent-gold: #FFD56B;
      --shadow-soft: 0 22px 50px -12px rgba(0, 0, 0, 0.55);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    @keyframes auroraFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes steamRise {
      0% { transform: translateY(4px) scale(0.85); opacity: 0; }
      50% { opacity: 0.85; }
      100% { transform: translateY(-14px) scale(1.15); opacity: 0; }
    }
    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(76, 217, 100, 0.65); }
      70% { box-shadow: 0 0 0 9px rgba(76, 217, 100, 0); }
      100% { box-shadow: 0 0 0 0 rgba(76, 217, 100, 0); }
    }
    @keyframes holoSweep {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes floatCrown {
      0%, 100% { transform: translateY(0px) rotate(-6deg); }
      50% { transform: translateY(-5px) rotate(6deg); }
    }

    body {
      font-family: 'Kanit', 'Outfit', sans-serif;
      color: var(--text-main);
      background: linear-gradient(-45deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3), var(--bg-grad-4));
      background-size: 350% 350%;
      animation: auroraFlow 18s ease infinite;
      min-height: 100dvh;
      padding: clamp(12px, 2.5vw, 24px) clamp(12px, 3vw, 22px) 80px;
      overflow-x: hidden;
      transition: color 0.4s ease;
    }

    .app-container { max-width: 1260px; margin: 0 auto; position: relative; z-index: 2; }
    .boot-screen { min-height: 75vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-weight: 700; font-size: 1.08rem; color: var(--text-muted); }

    /* Tactile Frosted Acrylic Glass */
    .acrylic-panel {
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid var(--border-soft);
      border-radius: 26px;
      box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    /* 🧭 Magnetic Floating Header & Tabs */
    .top-header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 14px; padding: 14px 20px; margin-bottom: 16px;
    }
    .brand-cluster { display: flex; align-items: center; gap: 12px; }
    .brand-logo-orb {
      width: 48px; height: 48px; border-radius: 16px;
      background: linear-gradient(135deg, #FF758F, #B56576, #504027);
      color: #fff; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 22px rgba(181, 101, 118, 0.35);
      position: relative;
    }
    .brand-title h1 { font-size: clamp(1.08rem, 2.2vw, 1.32rem); font-weight: 800; line-height: 1.2; }
    .brand-title p { font-size: 0.78rem; color: var(--text-muted); }

    .nav-pills-wrap {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      background: rgba(181, 101, 118, 0.12); padding: 5px; border-radius: 999px;
      border: 1px solid var(--border-soft);
    }
    .nav-tab-btn {
      position: relative; border: none; background: transparent;
      color: var(--text-main); font-family: inherit; font-size: 0.84rem; font-weight: 700;
      padding: 8px 16px; border-radius: 999px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; z-index: 1;
      transition: color 0.2s ease;
    }
    .nav-tab-btn.active { color: #FFF; }
    .nav-tab-pill-bg {
      position: absolute; inset: 0; border-radius: 999px;
      background: linear-gradient(135deg, #B56576, #504027);
      box-shadow: 0 6px 16px rgba(80, 45, 55, 0.28); z-index: -1;
    }
    body[data-ambiance="night"] .nav-tab-pill-bg {
      background: linear-gradient(135deg, #FF758F, #B56576);
    }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .icon-action-btn {
      width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--border-soft);
      background: var(--surface-card); color: var(--text-main);
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .register-cta-btn {
      text-decoration: none;
      background: linear-gradient(135deg, #504027 0%, #A19D70 100%);
      color: #FBEED2; border: 1.5px solid #FCCEAB;
      padding: 7px 15px; border-radius: 999px; font-size: 0.8rem; font-weight: 700;
      display: inline-flex; align-items: center; gap: 7px;
      box-shadow: 0 6px 16px rgba(80, 64, 39, 0.25);
    }
    .unreg-badge {
      background: rgba(251, 238, 210, 0.25); padding: 1px 8px; border-radius: 999px;
      font-size: 0.72rem; font-weight: 800;
    }

    /* 🎧 Live Voice Stage Strip */
    .voice-stage-strip {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px; padding: 11px 18px; margin-bottom: 18px;
      background: linear-gradient(90deg, rgba(181,101,118,0.14), rgba(252,206,171,0.22), rgba(161,157,112,0.15));
    }
    .voice-stage-left { display: flex; align-items: center; gap: 10px; }
    .live-dot {
      width: 11px; height: 11px; border-radius: 50%; background: #2ECC71;
      animation: pulseRing 2s infinite; flex-shrink: 0;
    }
    .voice-avatars-rail { display: flex; align-items: center; gap: 10px; overflow-x: auto; padding: 2px 4px; }
    .voice-speaker-chip {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--surface-card); border: 1.5px solid #2ECC71;
      padding: 4px 11px 4px 5px; border-radius: 999px; font-size: 0.78rem; font-weight: 700;
      box-shadow: 0 4px 12px rgba(46, 204, 113, 0.16);
    }
    .voice-speaker-chip img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
    .steam-icon { display: inline-block; animation: steamRise 2.2s ease-in-out infinite; font-size: 0.85rem; }

    /* 🍱 Bento Grid Stats */
    .bento-stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px;
    }
    .bento-stat-card {
      padding: 16px 18px; position: relative; overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
    }
    .bento-stat-label { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .bento-stat-value {
      font-family: 'Outfit', 'JetBrains Mono', sans-serif;
      font-size: clamp(1.45rem, 2.4vw, 1.95rem); font-weight: 800; color: var(--text-main);
      display: flex; align-items: baseline; gap: 6px;
    }
    .bento-stat-sub { font-size: 0.73rem; color: var(--accent-primary); font-weight: 600; }

    /* 📅 Heatmap Date Filter Rail */
    .heatmap-bar {
      padding: 14px 18px; margin-bottom: 20px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .heatmap-scroll {
      display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 4px;
    }
    .heatmap-scroll::-webkit-scrollbar { height: 6px; }
    .heatmap-scroll::-webkit-scrollbar-thumb { background: var(--accent-primary); border-radius: 99px; }
    .date-pill-btn {
      flex-shrink: 0; border: 1.5px solid var(--border-soft); background: var(--surface-card);
      color: var(--text-main); padding: 7px 14px; border-radius: 14px;
      font-family: inherit; font-size: 0.78rem; font-weight: 700; cursor: pointer;
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      transition: all 0.18s ease;
    }
    .date-pill-btn.heat-high { border-color: #D48A27; background: linear-gradient(135deg, rgba(255,213,107,0.18), var(--surface-card)); }
    .date-pill-btn.active {
      background: linear-gradient(135deg, #B56576, #504027); color: #FFF; border-color: transparent;
      box-shadow: 0 8px 18px rgba(80, 45, 55, 0.25); transform: translateY(-2px);
    }

    /* 🎫 Perforated Specialty Ticket Receipt Cards */
    .sessions-list { display: flex; flex-direction: column; gap: 20px; }
    .session-block { padding: 20px; position: relative; overflow: hidden; }
    .session-header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px; padding-bottom: 14px; margin-bottom: 16px;
      border-bottom: 2px dashed var(--border-soft);
    }
    .session-author { display: flex; align-items: center; gap: 12px; }
    .session-author img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-primary); }
    .status-badge {
      padding: 4px 12px; border-radius: 999px; font-size: 0.74rem; font-weight: 800;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .status-badge.open { background: rgba(46, 204, 113, 0.18); color: #27AE60; border: 1.5px solid #2ECC71; }
    .status-badge.closed { background: rgba(140, 83, 97, 0.16); color: var(--text-muted); border: 1.5px solid var(--border-soft); }

    .tickets-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px;
    }
    .specialty-ticket {
      position: relative; background: var(--surface-card);
      border: 1.5px solid var(--border-soft); border-radius: 20px;
      padding: 16px 18px; overflow: hidden;
      box-shadow: 0 10px 24px rgba(80, 45, 55, 0.08);
      display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    }
    /* รอยปรุตั๋วซ้าย-ขวา */
    .specialty-ticket::before, .specialty-ticket::after {
      content: ''; position: absolute; top: 58%; width: 18px; height: 18px;
      border-radius: 50%; background: var(--bg-grad-1);
      border: 1.5px solid var(--border-soft); z-index: 2;
    }
    .specialty-ticket::before { left: -10px; }
    .specialty-ticket::after { right: -10px; }

    /* SSR Holographic Foil Overlay */
    .specialty-ticket.holo-ssr {
      border: 2px solid #D48A27;
      box-shadow: 0 12px 28px rgba(212, 138, 39, 0.22);
    }
    .ssr-foil-layer {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(125deg, transparent 15%, rgba(255,215,0,0.22) 35%, rgba(255,182,193,0.25) 50%, rgba(195,166,255,0.22) 65%, transparent 85%);
      background-size: 250% 250%; animation: holoSweep 5s ease infinite;
    }

    .ticket-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: relative; z-index: 1; }
    .ticket-guest { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .ticket-guest img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--accent-primary); }
    .ticket-queue-num {
      font-family: 'JetBrains Mono', monospace; font-size: 0.73rem; font-weight: 700;
      padding: 2px 8px; border-radius: 8px; background: rgba(181,101,118,0.12); color: var(--accent-primary);
    }

    .ticket-order-box {
      background: rgba(181, 101, 118, 0.06); border: 1px dashed var(--border-soft);
      border-radius: 14px; padding: 10px 12px; position: relative; z-index: 1;
    }
    .ticket-drink-title { font-size: 0.9rem; font-weight: 800; line-height: 1.35; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .ticket-addons { font-size: 0.76rem; color: var(--text-muted); margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }

    .ticket-bottom {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 8px; border-top: 1.5px dashed var(--border-soft);
      font-family: 'JetBrains Mono', 'Kanit', sans-serif; font-size: 0.8rem; position: relative; z-index: 1;
    }
    .ticket-price-tag { font-size: 0.95rem; font-weight: 800; color: var(--accent-gold); }
    .barcode-strip {
      height: 14px; width: 64px; opacity: 0.35;
      background: repeating-linear-gradient(90deg, var(--text-main) 0 2px, transparent 2px 4px, var(--text-main) 4px 5px, transparent 5px 8px);
    }

    .tier-badge { font-size: 0.66rem; font-weight: 800; padding: 2px 7px; border-radius: 999px; flex-shrink: 0; }
    .tier-SSR { background: linear-gradient(135deg, #FFD700, #FF9AA2); color: #4A2530; }
    .tier-SR { background: linear-gradient(135deg, #E2D1F9, #C3A6FF); color: #3B1E6D; }
    .tier-R { background: linear-gradient(135deg, #C1E1C1, #8FD19E); color: #1B4D20; }
    .tier-C { background: #FFE5EC; color: #7A4957; }
    .tier-MYSTERY { background: linear-gradient(90deg, #FFB7B2, #FFDAC1, #B5EAD7, #C7CEEA); color: #4A2530; }

    /* 🪪 3D Tilt Collector Member Cards */
    .directory-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 18px; margin-bottom: 18px;
    }
    .search-input-box {
      flex: 1; min-width: 240px; display: flex; align-items: center; gap: 8px;
      background: var(--surface-card); border: 1.5px solid var(--border-soft);
      padding: 8px 14px; border-radius: 999px;
    }
    .search-input-box input {
      width: 100%; border: none; background: transparent; color: var(--text-main);
      font-family: inherit; font-size: 0.88rem; outline: none;
    }

    .members-collector-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px;
    }
    .collector-card {
      position: relative; background: var(--surface-card);
      border: 2px solid var(--border-soft); border-radius: 24px;
      padding: 20px 18px; text-align: center; overflow: hidden;
      box-shadow: var(--shadow-soft);
      transform-style: preserve-3d; will-change: transform;
      display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    }
    .collector-card.sultan-gold {
      border: 2.5px solid #FFD56B;
      box-shadow: 0 20px 44px -10px rgba(212, 138, 39, 0.35);
    }
    .card-glare {
      position: absolute; inset: 0; pointer-events: none; z-index: 3;
      background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,0.65) 0%, rgba(255,182,193,0.2) 35%, transparent 70%);
      opacity: var(--gop, 0); transition: opacity 0.2s ease;
    }
    .sultan-crown-badge {
      position: absolute; top: 12px; left: 12px; z-index: 4;
      background: linear-gradient(135deg, #FFD700, #F39C12); color: #3D2300;
      font-size: 0.72rem; font-weight: 800; padding: 3px 10px; border-radius: 999px;
      box-shadow: 0 4px 12px rgba(243, 156, 18, 0.4);
      display: inline-flex; align-items: center; gap: 4px;
      animation: floatCrown 3s ease-in-out infinite;
    }
    .enamel-role-pin {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 11px; border-radius: 999px; font-size: 0.72rem; font-weight: 800;
      background: var(--surface-glass); border: 1.5px solid var(--role-color, #F4978E);
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.6), 0 3px 8px rgba(0,0,0,0.08);
    }

    .collector-avatar-wrap {
      width: 88px; height: 88px; margin: 4px auto; position: relative;
    }
    .collector-avatar-wrap img {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
      border: 3px solid var(--role-color, #FFCAD4); background: #fff;
    }
    .presence-dot {
      position: absolute; bottom: 4px; right: 4px; width: 16px; height: 16px;
      border-radius: 50%; border: 2.5px solid var(--surface-card);
    }
    .presence-online { background: #2ECC71; }
    .presence-idle { background: #F1C40F; }
    .presence-dnd { background: #E74C3C; }
    .presence-offline { background: #95A5A6; }

    .status-speech-bubble {
      font-size: 0.75rem; color: var(--text-muted); background: rgba(181,101,118,0.08);
      border: 1px solid var(--border-soft); border-radius: 12px; padding: 5px 10px;
      line-height: 1.35;
    }

    .collector-info-box {
      background: rgba(181,101,118,0.06); border-radius: 14px; padding: 9px 11px;
      text-align: left; font-size: 0.78rem; display: flex; flex-direction: column; gap: 4px;
    }

    .edit-pin-btn {
      width: 100%; padding: 8px 12px; border-radius: 12px;
      border: 1.5px solid var(--border-soft); background: var(--surface-glass);
      color: var(--text-main); font-family: inherit; font-size: 0.78rem; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.18s ease;
    }
    .edit-pin-btn:hover { background: var(--accent-primary); color: #FFF; border-color: transparent; }

    /* 🔐 Modal แก้ไขบัตรสมาชิกด้วยรหัส PIN 4 หลัก */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 950; background: rgba(25, 14, 20, 0.76);
      backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-card {
      width: 100%; max-width: 480px; background: var(--surface-card);
      border: 2.5px solid var(--accent-primary); border-radius: 26px; padding: 24px 22px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 12px;
    }
    .modal-input {
      width: 100%; padding: 10px 14px; border-radius: 12px;
      border: 1.5px solid var(--border-soft); background: var(--surface-glass);
      color: var(--text-main); font-family: inherit; font-size: 0.88rem; outline: none;
    }

    @media (max-width: 900px) {
      .bento-stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      .bento-stats-grid { grid-template-columns: 1fr; }
      .top-header { justify-content: center; }
    }
  </style>
</head>
<body data-ambiance="day">
  <div id="root">
    <div class="boot-screen">☕ กำลังเปิดสมุดบันทึกคาเฟ่และทำเนียบสมาชิก Horizontal...</div>
  </div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { motion, AnimatePresence } from 'framer-motion';
    import {
      Coffee, Users, Receipt, BookOpen, Sparkles, Volume2, VolumeX,
      Sun, Sunset, Moon, Search, Crown, ShieldCheck, Calendar, RefreshCw, Lock, Edit3, X
    } from 'lucide-react';
    import confetti from 'canvas-confetti';

    const THAI_MONTHS = [
      'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
      'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
    ];

    // 🔊 ระบบสังเคราะห์เสียงประกอบสไตล์คาเฟ่ (Web Audio API 0KB Load)
    class CafeSoundEngine {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
      }
      playPop(freq = 520, duration = 0.06) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.35, this.ctx.currentTime + duration);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }
      playCoin() {
        this.playPop(987.77, 0.08);
        setTimeout(() => this.playPop(1318.51, 0.14), 70);
      }
    }

    // 🔢 คอมโพเนนต์ตัวเลขหมุนวิ่งอัตโนมัติ (Rolling Number Ticker)
    function RollingNumber({ value }) {
      const [displayVal, setDisplayVal] = useState(0);
      useEffect(() => {
        const target = Number(value) || 0;
        let start = displayVal;
        const diff = target - start;
        if (diff === 0) return;
        const steps = 18;
        let currentStep = 0;
        const timer = setInterval(() => {
          currentStep++;
          if (currentStep >= steps) {
            setDisplayVal(target);
            clearInterval(timer);
          } else {
            const progress = 1 - Math.pow(1 - currentStep / steps, 3);
            setDisplayVal(Math.round(start + diff * progress));
          }
        }, 22);
        return () => clearInterval(timer);
      }, [value]);
      return <span>{displayVal.toLocaleString('en-US')}</span>;
    }

    // 🪪 การ์ดสมาชิก 3D Collector Tilt

        transform: 'perspective(900px) rotateX(0deg) rotateY(0deg)',
        '--gx': '50%', '--gy': '50%', '--gop': 0
      });

      const handleMove = (e) => {
        if (!cardRef.current || !window.matchMedia('(hover: hover)').matches) return;
        const r = cardRef.current.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width;
        const py = (e.clientY - r.top) / r.height;
        const rx = (0.5 - py) * 11;
        const ry = (px - 0.5) * 11;
        setTilt({
          transform: `perspective(900px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`,
          '--gx': `${(px * 100).toFixed(1)}%`,
          '--gy': `${(py * 100).toFixed(1)}%`,
          '--gop': 0.85
        });
      };

      const handleLeave = () => {
        setTilt({
          transform: 'perspective(900px) rotateX(0deg) rotateY(0deg)',
          '--gx': '50%', '--gy': '50%', '--gop': 0
        });
      };

      const isSultan = Boolean(member.sultanRank && member.sultanRank <= 3);

          layout

          animate={{ opacity: 1, y: 0 }}
          whileHover={{ y: -4 }}
          onMouseMove={handleMove}

                              <div className="ticket-top">
                                <div className="ticket-guest">
                                  <img src={r.userAvatar || 'https://cdn.discordapp.com/embed/avatars/0.png'} alt={r.userName} />
                                  <div style={{ minWidth: 0 }}>
                                    <div style={{ fontSize: '0.88rem', fontWeight: 800, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                                      คุณ{r.userName}
                                    </div>
                                    <div style={{ fontSize: '0.71rem', color: r.isPresent ? '#27AE60' : 'var(--text-muted)', fontWeight: 700 }}>
                                      {r.isPresent ? '🟢 กำลังนั่งจิบในร้าน ♨️' : `เช็กบิลตอน ${r.exitTimeText || '-'} น.`}
                                    </div>
                                  </div>
                                </div>
                                <span className="ticket-queue-num">#{String(rIdx + 1).padStart(2, '0')}</span>
                              </div>

                              <div className="ticket-order-box">
                                <div className="ticket-drink-title">
                                  <span>🍹 {r.drinkName}</span>
                                  <span className={`tier-badge tier-${tierClass}`}>{r.tierCode || 'C'}</span>
                                </div>
                                <div className="ticket-addons">
                                  <span>🍯 ความหวาน: {r.sweetness || 'หวานปกติ'}</span>
                                  {r.toppingName && <span>🧋 ท็อปปิ้ง: {r.toppingName} (+{r.toppingPrice} 🪙)</span>}
                                  {r.dessertName && <span>🍰 ขนมหวาน: {r.dessertName} (+{r.dessertPrice} 🪙)</span>}
                                </div>
                              </div>

                              <div className="ticket-bottom">
                                <div>
                                  <div style={{ fontSize: '0.68rem', color: 'var(--text-muted)' }}>เข้าเวลา {r.enterTimeText || '-'} น.</div>
                                  <div className="barcode-strip" />
                                </div>
                                <div className="ticket-price-tag">
                                  🪙 {Number(r.totalPrice || 0).toLocaleString()}
                                </div>
                              </div>
                            </motion.div>
                          );
                        })}
                      </div>
                    </motion.section>
                  ))
                )}
              </div>
            </motion.div>
          )}

          {/* ================= แท็บที่ 2: ทำเนียบสมาชิกโฮโลแกรม 3D ================= */}
          {activeTab === 'members' && (
            <motion.div initial={{ opacity: 0, y: 12 }} animate={{ opacity: 1, y: 0 }}>
              <div className="directory-toolbar acrylic-panel">
                <div className="search-input-box">
                  <Search size={17} color="var(--text-muted)" />
                  <input
                    type="text"
                    placeholder="🔍 ค้นหาชื่อเล่น, ชื่อ Discord, เมนูโปรด, หรือสเตตัสเกม/เพลงที่เพื่อนกำลังเปิด..."
                    value={memberSearch}
                    onChange={e => setMemberSearch(e.target.value)}
                  />
                </div>
                <div style={{ fontSize: '0.8rem', fontWeight: 700, color: 'var(--text-muted)' }}>
                  👑 สุลต่าน 3 อันดับแรกจะได้รับมงกุฎทองคำบนบัตรสมาชิกอัตโนมัติ
                </div>
              </div>

              <div className="members-collector-grid">
                {filteredMembers.map(member => (
                  <CollectorMemberCard
                    key={member.discordId}
                    member={member}
                    onOpenEdit={openEditModal}
                  />
                ))}
              </div>
            </motion.div>
          )}

          {/* ================= แท็บที่ 3: สมุดเมนู & อันดับสุลต่าน ================= */}
          {activeTab === 'passbook' && (
            <motion.div initial={{ opacity: 0, y: 12 }} animate={{ opacity: 1, y: 0 }} style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: 18 }}>
              <div className="acrylic-panel" style={{ padding: 22 }}>
                <h2 style={{ fontSize: '1.12rem', fontWeight: 800, marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8 }}>
                  👑 หอเกียรติยศสุลต่านประจำคาเฟ่ (Top 10)
                </h2>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  {[...(overview?.members || [])]
                    .sort((a, b) => (b.totalSpent + b.walletBalance) - (a.totalSpent + a.walletBalance))
                    .slice(0, 10)
                    .map((m, idx) => (
                      <div
                        key={m.discordId}
                        style={{
                          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                          padding: '10px 14px', borderRadius: 16, background: 'var(--surface-card)',
                          border: idx < 3 ? '2px solid #FFD56B' : '1px solid var(--border-soft)'
                        }}
                      >
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                          <span style={{ fontWeight: 800, width: 24 }}>{idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`}</span>
                          <img src={m.avatarUrl} style={{ width: 36, height: 36, borderRadius: '50%' }} alt="" />
                          <div>
                            <div style={{ fontWeight: 800, fontSize: '0.88rem' }}>{m.nickname ? `คุณ${m.nickname}` : m.displayName}</div>
                            <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>เข้าคาเฟ่ {m.visitCount || 0} ครั้ง</div>
                          </div>
                        </div>
                        <div style={{ textAlign: 'right' }}>
                          <div style={{ fontWeight: 800, fontSize: '0.86rem', color: 'var(--accent-gold)' }}>
                            🧾 อุดหนุน {Number(m.totalSpent || 0).toLocaleString()} 🪙
                          </div>
                          <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>
                            กระเป๋า {Number(m.walletBalance || 0).toLocaleString()} 🪙
                          </div>
                        </div>
                      </div>
                    ))}
                </div>
              </div>

              <div className="acrylic-panel" style={{ padding: 22 }}>
                <h2 style={{ fontSize: '1.12rem', fontWeight: 800, marginBottom: 12 }}>
                  🍹 สมุดแคตตาล็อกเมนูบาริสต้าอเลสเทีย
                </h2>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 12, maxHeight: 540, overflowY: 'auto', paddingRight: 4 }}>
                  {catalogCategories.map(cat => (
                    <div key={cat.id} style={{ background: 'var(--surface-card)', borderRadius: 16, padding: 14, border: '1px solid var(--border-soft)' }}>
                      <div style={{ fontWeight: 800, fontSize: '0.92rem', marginBottom: 8 }}>
                        {cat.icon} {cat.title} ({(cat.items || []).length} เมนู)
                      </div>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                        {(cat.items || []).map(it => (
                          <span
                            key={it.name}
                            onMouseEnter={() => sfx.playPop(820, 0.03)}
                            style={{
                              fontSize: '0.75rem', padding: '4px 10px', borderRadius: 999,
                              background: 'rgba(181,101,118,0.08)', border: '1px solid var(--border-soft)',
                              display: 'inline-flex', alignItems: 'center', gap: 5
                            }}
                          >
                            <span>{it.name}</span>
                            <b style={{ color: 'var(--accent-gold)' }}>{it.isMystery ? '199-999' : it.price} 🪙</b>
                          </span>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </motion.div>
          )}

          {/* 🔐 ป๊อปอัปแก้ไขบัตรสมาชิกด้วยรหัสปลอดภัย PIN 4 หลัก */}
          <AnimatePresence>
            {editingMember && (
              <motion.div
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                exit={{ opacity: 0 }}
                className="modal-backdrop"
              >
                <motion.form
                  initial={{ scale: 0.9, y: 14 }}
                  animate={{ scale: 1, y: 0 }}
                  exit={{ scale: 0.9, y: 14 }}
                  onSubmit={submitMemberUpdate}
                  className="modal-card"
                >
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div style={{ fontSize: '1.1rem', fontWeight: 800, display: 'flex', alignItems: 'center', gap: 6 }}>
                      <Edit3 size={18} /> แก้ไขบัตรสมาชิก: {editingMember.displayName}
                    </div>
                    <button type="button" onClick={() => setEditingMember(null)} className="icon-action-btn" style={{ width: 32, height: 32 }}>
                      <X size={16} />
                    </button>
                  </div>

                  <div>
                    <label style={{ fontSize: '0.78rem', fontWeight: 700 }}>🏷️ ชื่อเล่นประจำคาเฟ่</label>
                    <input
                      type="text"
                      className="modal-input"
                      value={editForm.nickname}
                      onChange={e => setEditForm({ ...editForm, nickname: e.target.value })}
                      required
                    />
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                    <div>
                      <label style={{ fontSize: '0.78rem', fontWeight: 700 }}>🎂 วันที่เกิด</label>
                      <input
                        type="number"
                        min="1"
                        max="31"
                        className="modal-input"
                        value={editForm.birthdayDay}
                        onChange={e => setEditForm({ ...editForm, birthdayDay: Number(e.target.value) })}
                      />
                    </div>
                    <div>
                      <label style={{ fontSize: '0.78rem', fontWeight: 700 }}>📅 เดือนเกิด</label>
                      <select
                        className="modal-input"
                        value={editForm.birthdayMonth}
                        onChange={e => setEditForm({ ...editForm, birthdayMonth: Number(e.target.value) })}
                      >
                        {THAI_MONTHS.map((m, i) => (
                          <option key={m} value={i + 1}>{m}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label style={{ fontSize: '0.78rem', fontWeight: 700 }}>⭐ เมนูโปรดประจำตัว</label>
                    <select
                      className="modal-input"
                      value={editForm.favoriteMenu}
                      onChange={e => setEditForm({ ...editForm, favoriteMenu: e.target.value })}
                    >
                      <option value="ขอคิดดูก่อน">-- ขอคิดดูก่อน / สุ่มหน้าบาร์ --</option>
                      {allDrinkOptions.map(d => <option key={`fav-${d}`} value={d}>{d}</option>)}
                    </select>
                  </div>

                  <div>
                    <label style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--accent-gold)' }}>
                      🔐 ยืนยันรหัสปลอดภัย PIN 4 หลักของคุณ
                    </label>
                    <input
                      type="password"
                      inputMode="numeric"
                      maxLength={4}
                      placeholder="กรอกตัวเลข 4 หลัก..."
                      className="modal-input"
                      style={{ textAlign: 'center', fontSize: '1.2rem', fontWeight: 800, letterSpacing: '6px' }}
                      value={editForm.pin}
                      onChange={e => setEditForm({ ...editForm, pin: e.target.value.replace(/\D/g, '').slice(0, 4) })}
                      required
                    />
                  </div>

                  {editStatus && (
                    <div style={{ fontSize: '0.82rem', fontWeight: 700, color: editStatus.ok ? '#27AE60' : '#E74C3C', textAlign: 'center' }}>
                      {editStatus.text}
                    </div>
                  )}

                  <button
                    type="submit"
                    style={{
                      width: '100%', padding: '12px', borderRadius: 14, border: 'none',
                      background: 'linear-gradient(135deg, #B56576, #504027)', color: '#FFF',
                      fontFamily: 'inherit', fontSize: '0.94rem', fontWeight: 800, cursor: 'pointer'
                    }}
                  >
                    ✨ บันทึกการแก้ไขบัตรสมาชิก
                  </button>
                </motion.form>
              </motion.div>
            )}
          </AnimatePresence>
        </div>
      );
    }

    createRoot(document.getElementById('root')).render(<HorizontalDashboardApp />);
  </script>
</body>
</html>
